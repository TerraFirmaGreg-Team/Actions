name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint actions and docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.8

      - name: Validate README references
        shell: python
        run: |
          import pathlib
          import re

          repo = pathlib.Path('.')
          readmes = [repo / "README.md"] + list(repo.glob("*/README.md"))
          pattern = re.compile(r"TerraFirmaGreg-Team/Actions-[^/]+/")
          bad = []
          for readme in readmes:
              text = readme.read_text(encoding="utf-8")
              for match in pattern.findall(text):
                  bad.append((readme, match))
          if bad:
              for readme, match in bad:
                  print(f"Found legacy reference '{match}' in {readme}")
              raise SystemExit(1)

  self-test:
    name: Validate composite metadata
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate action manifests
        shell: python
        run: |
          import pathlib
          import yaml

          root = pathlib.Path('.')
          action_dirs = [root / d for d in ['info', 'build', 'create-pr', 'release', 'message']]

          for action_dir in action_dirs:
            manifest = action_dir / 'action.yml'
            readme = action_dir / 'README.md'
            if not manifest.exists():
              raise SystemExit(f"Missing action.yml in {action_dir}")
            if not readme.exists():
              raise SystemExit(f"Missing README.md in {action_dir}")

            data = yaml.safe_load(manifest.read_text(encoding='utf-8'))
            if data.get('runs', {}).get('using') != 'composite':
              raise SystemExit(f"Action {action_dir.name} is not composite")

            required_keys = ['name', 'description', 'inputs', 'runs']
            missing = [k for k in required_keys if k not in data]
            if missing:
              raise SystemExit(f"Action {action_dir.name} missing keys: {missing}")

          print('All composite manifests look good')
