name: Build Modpack Artifacts

on:
  workflow_call:
    inputs:
      project_name:
        type: string
        required: true
      project_version:
        type: string
        required: true
      project_full_name:
        type: string
        required: true
      release_type:
        type: string
        default: release
      apply_version_overrides:
        description: "Выполнять замену DEV -> версия в конфигурации"
        type: boolean
        default: true
      artifact_curseforge:
        type: boolean
        default: true
      artifact_modrinth:
        type: boolean
        default: true
      artifact_server:
        type: boolean
        default: true
      artifact_multimc:
        type: boolean
        default: true
      pakku_arguments:
        description: "Дополнительные аргументы для pakku export"
        type: string
        default: ""
    outputs:
      curseforge_name:
        value: ${{ jobs.package.outputs.curseforge_name }}
      modrinth_name:
        value: ${{ jobs.package.outputs.modrinth_name }}
      server_name:
        value: ${{ jobs.server.outputs.server_name }}
      multimc_name:
        value: ${{ jobs.multimc.outputs.multimc_name }}

jobs:
  prepare:
    name: 🛠️ Prepare workspace
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      full_name: ${{ steps.vars.outputs.full_name }}
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v5.0.0

      - name: 📥 Download pakku
        run: |
          curl -sSL https://github.com/juraj-hrivnak/pakku/releases/latest/download/pakku.jar -o pakku.jar

      - name: 🔄 Apply version overrides
        if: inputs.apply_version_overrides
        shell: bash
        env:
          VERSION: ${{ inputs.project_version }}
        run: |
          set +e
          files=(
            "groovy/runConfig.json"
            "config/fancymenu/customization/gui_main_menu.txt"
            ".pakku/multimc-overrides/instance.cfg"
          )
          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then
              sed -i -e "s/DEV/${VERSION}/g" "$file"
            fi
          done

      - name: 🔧 Replace groovy debug flag
        if: inputs.apply_version_overrides
        shell: bash
        run: |
          node - <<'NODE'
const fs = require('fs');
const path = 'groovy/runConfig.json';
if (!fs.existsSync(path)) process.exit(0);
const data = JSON.parse(fs.readFileSync(path, 'utf8'));
data.debug = false;
fs.writeFileSync(path, JSON.stringify(data, null, 2));
NODE

      - name: 📤 Export variables
        id: vars
        run: |
          echo "version=${{ inputs.project_version }}" >> $GITHUB_OUTPUT
          echo "full_name=${{ inputs.project_full_name }}" >> $GITHUB_OUTPUT

  package:
    name: 📦 Build CurseForge / Modrinth
    needs: prepare
    runs-on: ubuntu-latest
    if: inputs.artifact_curseforge || inputs.artifact_modrinth
    outputs:
      curseforge_name: ${{ steps.curseforge.outputs.name }}
      modrinth_name: ${{ steps.modrinth.outputs.name }}
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v5.0.0

      - name: ♻️ Restore build cache
        if: false
        uses: actions/cache@v4.1.2
        with:
          path: build/.cache
          key: ${{ runner.os }}-pakku-cache-${{ hashFiles('build/.cache/**') }}

      - name: 🔁 Export modpack
        run: |
          curl -sSL https://github.com/juraj-hrivnak/pakku/releases/latest/download/pakku.jar -o pakku.jar
          java -jar pakku.jar export ${{ inputs.pakku_arguments }}

      - name: 📁 Prepare CurseForge artifact
        id: curseforge
        if: inputs.artifact_curseforge
        shell: bash
        env:
          FULL_NAME: ${{ inputs.project_full_name }}
        run: |
          cd build/curseforge
          file=$(ls *.zip | head -n1)
          if [[ -z "$file" ]]; then
            echo "::error::No curseforge artifact found"; exit 1
          fi
          new="${FULL_NAME}-curseforge.zip"
          mv "$file" "$new"
          echo "name=$new" >> $GITHUB_OUTPUT

      - name: 🚀 Upload CurseForge artifact
        if: inputs.artifact_curseforge
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ inputs.project_full_name }}-curseforge
          path: build/curseforge/${{ steps.curseforge.outputs.name }}
          if-no-files-found: error

      - name: 📁 Prepare Modrinth artifact
        id: modrinth
        if: inputs.artifact_modrinth
        shell: bash
        env:
          FULL_NAME: ${{ inputs.project_full_name }}
        run: |
          cd build/modrinth
          file=$(ls *.mrpack | head -n1 || true)
          if [[ -z "$file" ]]; then
            echo "::warning::No modrinth artifact found"; exit 0
          fi
          new="${FULL_NAME}-modrinth.mrpack"
          mv "$file" "$new"
          echo "name=$new" >> $GITHUB_OUTPUT

      - name: 🚀 Upload Modrinth artifact
        if: inputs.artifact_modrinth && steps.modrinth.outputs.name
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ inputs.project_full_name }}-modrinth
          path: build/modrinth/${{ steps.modrinth.outputs.name }}
          if-no-files-found: warn

  server:
    name: 🖥️ Build Server Pack
    needs: prepare
    runs-on: ubuntu-latest
    if: inputs.artifact_server
    outputs:
      server_name: ${{ steps.server.outputs.name }}
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v5.0.0

      - name: 📁 Prepare overrides
        shell: bash
        run: |
          if [[ -d .pakku/server-overrides ]]; then
            mv -vf .pakku/server-overrides/* ./
          fi

      - name: 🔁 Export server pack
        run: |
          curl -sSL https://github.com/juraj-hrivnak/pakku/releases/latest/download/pakku.jar -o pakku.jar
          java -jar pakku.jar export

      - name: 📁 Rename server artifact
        id: server
        shell: bash
        env:
          FULL_NAME: ${{ inputs.project_full_name }}
        run: |
          cd build/serverpack
          file=$(ls *.zip | head -n1)
          new="${FULL_NAME}-serverpack.zip"
          mv "$file" "$new"
          echo "name=$new" >> $GITHUB_OUTPUT

      - name: 🚀 Upload server artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ inputs.project_full_name }}-serverpack
          path: build/serverpack/${{ steps.server.outputs.name }}
          if-no-files-found: error

  multimc:
    name: 🧰 Build MultiMC
    needs: prepare
    runs-on: ubuntu-latest
    if: inputs.artifact_multimc
    outputs:
      multimc_name: ${{ steps.multimc.outputs.name }}
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v5.0.0

      - name: 🔁 Export for MultiMC
        run: |
          curl -sSL https://github.com/juraj-hrivnak/pakku/releases/latest/download/pakku.jar -o pakku.jar
          java -jar pakku.jar --debug fetch
          java -jar pakku.jar --debug export

      - name: 📁 Prepare MultiMC structure
        shell: bash
        env:
          FULL_NAME: ${{ inputs.project_full_name }}
        run: |
          mkdir -p .pakku/multimc-overrides/flame
          mv -vf build/.cache/curseforge/manifest.json .pakku/multimc-overrides/flame/manifest.json
          mv -vf build/.cache/curseforge/overrides .pakku/multimc-overrides/.minecraft
          if [[ -d mods ]]; then
            mkdir -p .pakku/multimc-overrides/.minecraft/mods
            mv -vf mods .pakku/multimc-overrides/.minecraft/
          fi
          cd .pakku/multimc-overrides
          zip -r "${FULL_NAME}-multimc.zip" icon.png mmc-pack.json instance.cfg .minecraft/ flame/

      - name: 📁 Collect MultiMC artifact
        id: multimc
        shell: bash
        env:
          FULL_NAME: ${{ inputs.project_full_name }}
        run: |
          cd .pakku/multimc-overrides
          echo "name=${FULL_NAME}-multimc.zip" >> $GITHUB_OUTPUT

      - name: 🚀 Upload MultiMC artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ inputs.project_full_name }}-multimc
          path: .pakku/multimc-overrides/${{ steps.multimc.outputs.name }}
          if-no-files-found: error
