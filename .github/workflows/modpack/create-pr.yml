name: 🤝 Create Release Pull Request

on:
  workflow_call:
    inputs:
      enabled:
        description: "Выполнять ли создание PR"
        type: boolean
        default: true
      source_branch:
        description: "Исходная ветка"
        type: string
        default: dev
      target_branch:
        description: "Целевая ветка"
        type: string
        default: main
      project_name:
        description: "Имя проекта"
        type: string
        required: true
      project_version:
        description: "Версия проекта"
        type: string
        required: true
      project_full_name:
        description: "Имя проекта с версией"
        type: string
        required: true
      changelog:
        description: "Описание изменений"
        type: string
        default: ""
      pr_title_template:
        description: "Шаблон заголовка PR. Доступные переменные: ${NAME}, ${VERSION}, ${FULL_NAME}"
        type: string
        default: "Release: ${VERSION}"
      pr_body_template:
        description: |
          Шаблон тела PR. Доступные переменные: ${NAME}, ${VERSION}, ${FULL_NAME}, ${CHANGELOG}
        type: string
        default: |
          ## Release ${VERSION}

          - **Name**: ${NAME}
          - **Version**: ${VERSION}

          ${CHANGELOG}
    outputs:
      pr_number:
        value: ${{ jobs.create.outputs.pr_number }}
      pr_url:
        value: ${{ jobs.create.outputs.pr_url }}

jobs:
  create:
    if: inputs.enabled
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.result.outputs.number }}
      pr_url: ${{ steps.result.outputs.url }}
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: 🧮 Подготовить контент
        id: templates
        shell: bash
        env:
          PR_TITLE_TEMPLATE: ${{ inputs.pr_title_template }}
          PR_BODY_TEMPLATE: ${{ inputs.pr_body_template }}
          NAME: ${{ inputs.project_name }}
          VERSION: ${{ inputs.project_version }}
          FULL_NAME: ${{ inputs.project_full_name }}
          CHANGELOG: ${{ inputs.changelog || 'No changelog provided.' }}
        run: |
          printf '%s' "$PR_TITLE_TEMPLATE" | envsubst '$NAME $VERSION $FULL_NAME $CHANGELOG' > pr_title.txt
          printf '%s' "$PR_BODY_TEMPLATE" | envsubst '$NAME $VERSION $FULL_NAME $CHANGELOG' > pr_body.md

      - name: 🔍 Проверить существующий PR
        id: check
        uses: actions/github-script@v8.0.0
        env:
          HEAD_BRANCH: ${{ inputs.source_branch }}
          BASE_BRANCH: ${{ inputs.target_branch }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${process.env.HEAD_BRANCH}`,
              base: process.env.BASE_BRANCH,
              per_page: 100
            });

            if (prs.length > 0) {
              core.setOutput('exists', true);
              core.setOutput('number', prs[0].number);
              core.setOutput('url', prs[0].html_url);
            } else {
              core.setOutput('exists', false);
            }

      - name: 🆕 Создать PR
        if: steps.check.outputs.exists != 'true'
        id: create_pr
        uses: actions/github-script@v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const title = fs.readFileSync('pr_title.txt', 'utf8');
            const body = fs.readFileSync('pr_body.md', 'utf8');
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: '${{ inputs.source_branch }}',
              base: '${{ inputs.target_branch }}',
              title,
              body
            });
            core.setOutput('number', pr.number);
            core.setOutput('url', pr.html_url);

      - name: 📤 Результат
        id: result
        run: |
          if [[ "${{ steps.check.outputs.exists }}" == "true" ]]; then
            echo "number=${{ steps.check.outputs.number }}" >> $GITHUB_OUTPUT
            echo "url=${{ steps.check.outputs.url }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ steps.create_pr.outputs.number }}" >> $GITHUB_OUTPUT
            echo "url=${{ steps.create_pr.outputs.url }}" >> $GITHUB_OUTPUT
          fi
