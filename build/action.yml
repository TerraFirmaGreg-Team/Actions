name: "📦 Build Modpack Artifacts"
description: "Сборка и загрузка артефактов (CurseForge, Modrinth, Server, MultiMC)"

inputs:
  project_name:
    description: "Имя проекта"
    required: true
  project_version:
    description: "Версия проекта"
    required: true
  project_full_name:
    description: "Имя проекта с версией"
    required: true
  release_type:
    description: "Тип релиза"
    required: false
    default: release
  apply_version_overrides:
    description: "Применять замену DEV -> версия"
    required: false
    default: true
  artifact_curseforge:
    description: "Собирать артефакт CurseForge"
    required: false
    default: true
  artifact_modrinth:
    description: "Собирать артефакт Modrinth"
    required: false
    default: true
  artifact_server:
    description: "Собирать серверный пакет"
    required: false
    default: true
  artifact_multimc:
    description: "Собирать MultiMC пакет"
    required: false
    default: true
  pakku_arguments:
    description: "Дополнительные аргументы для pakku export"
    required: false
    default: ""

outputs:
  curseforge_name:
    description: "Имя файла CurseForge"
    value: ${{ steps.curseforge.outputs.name }}
  modrinth_name:
    description: "Имя файла Modrinth"
    value: ${{ steps.modrinth.outputs.name }}
  server_name:
    description: "Имя serverpack"
    value: ${{ steps.server.outputs.name }}
  multimc_name:
    description: "Имя MultiMC пакета"
    value: ${{ steps.multimc.outputs.name }}

runs:
  using: "composite"
  steps:
    - name: "📦 Checkout"
      uses: actions/checkout@v5.0.0

    - name: "📥 Download pakku"
      shell: bash
      run: |
        curl -sSL https://github.com/juraj-hrivnak/pakku/releases/latest/download/pakku.jar -o pakku.jar

    - name: "🔄 Apply version overrides"
      if: ${{ inputs.apply_version_overrides == 'true' }}
      shell: bash
      env:
        VERSION: ${{ inputs.project_version }}
      run: |
        set +e
        files=(
          "groovy/runConfig.json"
          "config/fancymenu/customization/gui_main_menu.txt"
          ".pakku/multimc-overrides/instance.cfg"
        )
        for file in "${files[@]}"; do
          if [[ -f "$file" ]]; then
            sed -i -e "s/DEV/${VERSION}/g" "$file"
          fi
        done

    - name: "🔧 Replace groovy debug flag"
      if: ${{ inputs.apply_version_overrides == 'true' }}
      shell: bash
      run: |
        node - <<'NODE'
const fs = require('fs');
const path = 'groovy/runConfig.json';
if (!fs.existsSync(path)) process.exit(0);
const data = JSON.parse(fs.readFileSync(path, 'utf8'));
data.debug = false;
fs.writeFileSync(path, JSON.stringify(data, null, 2));
NODE

    - name: "📦 Export modpack"
      id: export_modpack
      if: ${{ inputs.artifact_curseforge == 'true' || inputs.artifact_modrinth == 'true' }}
      shell: bash
      run: |
        java -jar pakku.jar export ${{ inputs.pakku_arguments }}

    - name: "📁 Prepare CurseForge artifact"
      id: curseforge
      if: ${{ inputs.artifact_curseforge == 'true' }}
      shell: bash
      env:
        FULL_NAME: ${{ inputs.project_full_name }}
      run: |
        cd build/curseforge
        file=$(ls *.zip | head -n1)
        if [[ -z "$file" ]]; then
          echo "::error::No curseforge artifact found"; exit 1
        fi
        new="${FULL_NAME}-curseforge.zip"
        mv "$file" "$new"
        echo "name=$new" >> $GITHUB_OUTPUT

    - name: "🚀 Upload CurseForge artifact"
      if: ${{ inputs.artifact_curseforge == 'true' }}
      uses: actions/upload-artifact@v4.6.2
      with:
        name: ${{ inputs.project_full_name }}-curseforge
        path: build/curseforge/${{ steps.curseforge.outputs.name }}
        if-no-files-found: error

    - name: "📁 Prepare Modrinth artifact"
      id: modrinth
      if: ${{ inputs.artifact_modrinth == 'true' }}
      shell: bash
      env:
        FULL_NAME: ${{ inputs.project_full_name }}
      run: |
        cd build/modrinth
        file=$(ls *.mrpack | head -n1 || true)
        if [[ -z "$file" ]]; then
          echo "::warning::No modrinth artifact found"; exit 0
        fi
        new="${FULL_NAME}-modrinth.mrpack"
        mv "$file" "$new"
        echo "name=$new" >> $GITHUB_OUTPUT

    - name: "🚀 Upload Modrinth artifact"
      if: ${{ inputs.artifact_modrinth == 'true' && steps.modrinth.outputs.name }}
      uses: actions/upload-artifact@v4.6.2
      with:
        name: ${{ inputs.project_full_name }}-modrinth
        path: build/modrinth/${{ steps.modrinth.outputs.name }}
        if-no-files-found: warn

    - name: "📁 Prepare server overrides"
      if: ${{ inputs.artifact_server == 'true' }}
      shell: bash
      run: |
        if [[ -d .pakku/server-overrides ]]; then
          mv -vf .pakku/server-overrides/* ./
        fi

    - name: "🔁 Export server pack"
      if: ${{ inputs.artifact_server == 'true' }}
      shell: bash
      run: |
        java -jar pakku.jar export

    - name: "📁 Rename server artifact"
      id: server
      if: ${{ inputs.artifact_server == 'true' }}
      shell: bash
      env:
        FULL_NAME: ${{ inputs.project_full_name }}
      run: |
        cd build/serverpack
        file=$(ls *.zip | head -n1)
        new="${FULL_NAME}-serverpack.zip"
        mv "$file" "$new"
        echo "name=$new" >> $GITHUB_OUTPUT

    - name: "🚀 Upload server artifact"
      if: ${{ inputs.artifact_server == 'true' }}
      uses: actions/upload-artifact@v4.6.2
      with:
        name: ${{ inputs.project_full_name }}-serverpack
        path: build/serverpack/${{ steps.server.outputs.name }}
        if-no-files-found: error

    - name: "🔁 Export for MultiMC"
      if: ${{ inputs.artifact_multimc == 'true' }}
      shell: bash
      run: |
        java -jar pakku.jar --debug fetch
        java -jar pakku.jar --debug export

    - name: "📁 Prepare MultiMC structure"
      if: ${{ inputs.artifact_multimc == 'true' }}
      shell: bash
      env:
        FULL_NAME: ${{ inputs.project_full_name }}
      run: |
        mkdir -p .pakku/multimc-overrides/flame
        mv -vf build/.cache/curseforge/manifest.json .pakku/multimc-overrides/flame/manifest.json
        mv -vf build/.cache/curseforge/overrides .pakku/multimc-overrides/.minecraft
        if [[ -d mods ]]; then
          mkdir -p .pakku/multimc-overrides/.minecraft/mods
          mv -vf mods .pakku/multimc-overrides/.minecraft/
        fi
        cd .pakku/multimc-overrides
        zip -r "${FULL_NAME}-multimc.zip" icon.png mmc-pack.json instance.cfg .minecraft/ flame/

    - name: "📁 Collect MultiMC artifact"
      id: multimc
      if: ${{ inputs.artifact_multimc == 'true' }}
      shell: bash
      env:
        FULL_NAME: ${{ inputs.project_full_name }}
      run: |
        cd .pakku/multimc-overrides
        echo "name=${FULL_NAME}-multimc.zip" >> $GITHUB_OUTPUT

    - name: "🚀 Upload MultiMC artifact"
      if: ${{ inputs.artifact_multimc == 'true' }}
      uses: actions/upload-artifact@v4.6.2
      with:
        name: ${{ inputs.project_full_name }}-multimc
        path: .pakku/multimc-overrides/${{ steps.multimc.outputs.name }}
        if-no-files-found: error
