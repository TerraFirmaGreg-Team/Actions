name: "🖥️ Collect Modpack Info"
description: "Сбор метаданных модпака, подготовка changelog и diff"

inputs:
  stable_branch:
    description: "Основная стабильная ветка"
    required: false
    default: main
  dev_branch:
    description: "Ветка разработки"
    required: false
    default: dev
  enable_dev_mode:
    description: "Включить dev-режим (build_# для нестабильных веток)"
    required: false
    default: true
  changelog_path:
    description: "Путь к CHANGELOG"
    required: false
    default: CHANGELOG.md
  changelog_unreleased_label:
    description: "Label для секции unreleased"
    required: false
    default: unreleased
  pakku_diff_enabled:
    description: "Строить diff между текущим и предыдущим pakku-lock"
    required: false
    default: true

outputs:
  project_name:
    description: "Короткое имя проекта"
    value: ${{ steps.meta.outputs.project_name }}
  project_version:
    description: "Версия проекта"
    value: ${{ steps.meta.outputs.project_version }}
  project_full_name:
    description: "Имя проекта с версией"
    value: ${{ steps.meta.outputs.project_full_name }}
  release_type:
    description: "Тип релиза"
    value: ${{ steps.meta.outputs.release_type }}
  mc_version:
    description: "Версия Minecraft"
    value: ${{ steps.meta.outputs.minecraft_version }}
  loader_type:
    description: "Тип загрузчика"
    value: ${{ steps.meta.outputs.loader_type }}
  loader_version:
    description: "Версия загрузчика"
    value: ${{ steps.meta.outputs.loader_version }}
  changelog:
    description: "Подготовленный changelog"
    value: ${{ steps.meta.outputs.description }}
  diff:
    description: "Diff между pakku-lock"
    value: ${{ steps.read_diff.outputs.diff }}
  tag_exists:
    description: "Существует ли тег"
    value: ${{ steps.tag_check.outputs.exists }}
  make_release:
    description: "Нужно ли публиковать релиз"
    value: ${{ steps.meta.outputs.make_release }}
  make_pr:
    description: "Нужно ли создавать PR"
    value: ${{ steps.meta.outputs.make_pr }}

runs:
  using: "composite"
  steps:
    - name: "⚙️ Determine dev environment"
      id: env_flags
      shell: bash
      run: |
        if [[ "${{ inputs.enable_dev_mode }}" == "true" && "${{ github.ref_name }}" != "${{ inputs.stable_branch }}" ]]; then
          echo "dev_env=true" >> "$GITHUB_OUTPUT"
        else
          echo "dev_env=false" >> "$GITHUB_OUTPUT"
        fi

    - name: "📦 Checkout"
      uses: actions/checkout@v5.0.0
      with:
        fetch-depth: 0

    - name: "🔍 Validate pakku.json"
      shell: bash
      run: |
        [[ -f pakku.json ]] || { echo "❌ pakku.json not found"; exit 1; }
        echo "✔️ pakku.json"

    - name: "🔍 Validate pakku-lock.json"
      shell: bash
      run: |
        [[ -f pakku-lock.json ]] || { echo "❌ pakku-lock.json not found"; exit 1; }
        echo "✔️ pakku-lock.json"

    - name: "📈 Fetch latest tag from stable"
      id: latest_tag
      shell: bash
      env:
        STABLE_BRANCH: ${{ inputs.stable_branch }}
      run: |
        set -eo pipefail
        git fetch --tags origin ${STABLE_BRANCH}
        tag=$(git describe --tags --abbrev=0 origin/${STABLE_BRANCH} 2>/dev/null || true)
        if [ -z "$tag" ]; then
          echo "⚠️ Latest tag not found on ${STABLE_BRANCH}"
          echo "tag=" >> $GITHUB_OUTPUT
        else
          echo "✔️ Latest tag: $tag"
          echo "tag=$tag" >> $GITHUB_OUTPUT
        fi

    - name: "🔍 Check pakku-lock.json in previous tag"
      id: previous_lock
      if: ${{ inputs.pakku_diff_enabled == 'true' }}
      shell: bash
      run: |
        set -eo pipefail
        latest_tag="${{ steps.latest_tag.outputs.tag }}"
        if [ -z "$latest_tag" ]; then
          echo "⚠️ Skip diff: latest tag missing"
          echo "available=false" >> $GITHUB_OUTPUT
          exit 0
        fi
        if git cat-file -e ${latest_tag}:pakku-lock.json 2>/dev/null; then
          git show ${latest_tag}:pakku-lock.json > pakku-lock-prev.json
          echo "✔️ Previous pakku-lock.json extracted"
          echo "available=true" >> $GITHUB_OUTPUT
        else
          echo "⚠️ previous pakku-lock.json not found"
          echo "available=false" >> $GITHUB_OUTPUT
        fi

    - name: "📦 Download pakku.jar"
      id: download_pakku
      if: ${{ inputs.pakku_diff_enabled == 'true' && steps.previous_lock.outputs.available == 'true' }}
      shell: bash
      run: |
        curl -sSL https://github.com/juraj-hrivnak/pakku/releases/latest/download/pakku.jar -o pakku.jar
        echo "✔️ pakku.jar downloaded"

    - name: "🔄 Run pakku diff"
      id: pakku_diff
      if: ${{ inputs.pakku_diff_enabled == 'true' && steps.previous_lock.outputs.available == 'true' }}
      shell: bash
      run: |
        set -eo pipefail
        java -jar pakku.jar diff -v --markdown PROJECTS_DIFF.md pakku-lock-prev.json pakku-lock.json
        [[ -f PROJECTS_DIFF.md ]] || { echo "❌ PROJECTS_DIFF.md not created"; exit 1; }
        echo "✔️ Diff generated"

    - name: "📝 Read diff"
      id: read_diff
      if: ${{ inputs.pakku_diff_enabled == 'true' && steps.previous_lock.outputs.available == 'true' }}
      shell: bash
      run: |
        {
          echo 'diff<<EOF'
          cat -v PROJECTS_DIFF.md
          echo EOF
        } >> "$GITHUB_OUTPUT"

    - name: "📊 Read pakku.json"
      id: pakku_json
      uses: ActionsTools/read-json-action@v1.0.5
      with:
        file_path: pakku.json

    - name: "📊 Read pakku-lock.json"
      id: pakku_lock_json
      uses: ActionsTools/read-json-action@v1.0.5
      with:
        file_path: pakku-lock.json

    - name: "📄 Parse changelog (stable)"
      id: collect_changelog
      uses: coditory/changelog-parser@v1.0.2
      with:
        path: ${{ inputs.changelog_path }}
      continue-on-error: true

    - name: "📄 Parse changelog (dev)"
      id: collect_changelog_dev
      if: ${{ steps.env_flags.outputs.dev_env == 'true' }}
      uses: coditory/changelog-parser@v1.0.2
      with:
        path: ${{ inputs.changelog_path }}
        version: ${{ inputs.changelog_unreleased_label }}
      continue-on-error: true

    - name: "🔍 Check tag existence"
      id: tag_check
      uses: mukunku/tag-exists-action@v1.6.0
      with:
        tag: ${{ steps.collect_changelog.outputs.version || steps.pakku_json.outputs.version }}

    - name: "🧮 Collect metadata"
      id: meta
      shell: bash
      env:
        DEV_ENVIRONMENT: ${{ steps.env_flags.outputs.dev_env }}
        CHANGELOG_VERSION: ${{ steps.collect_changelog.outputs.version }}
        CHANGELOG_DESCRIPTION: ${{ steps.collect_changelog.outputs.description }}
        CHANGELOG_DEV: ${{ steps.collect_changelog_dev.outputs.description }}
        PROJECT_NAME: ${{ steps.pakku_json.outputs.name }}
        RELEASE_TYPE: ${{ steps.pakku_json.outputs.release_type }}
        MC_VERSIONS: ${{ steps.pakku_lock_json.outputs.mc_versions }}
        LOADERS: ${{ steps.pakku_lock_json.outputs.loaders }}
        TAG_EXISTS: ${{ steps.tag_check.outputs.exists }}
        PAKKU_VERSION: ${{ steps.pakku_json.outputs.version }}
      run: |
        set -eo pipefail

        mc_version=$(echo "$MC_VERSIONS" | jq -r '.[0]' 2>/dev/null | tr -d '"')
        loader_type=$(echo "$LOADERS" | jq -r 'keys[0]' 2>/dev/null)
        loader_version=$(echo "$LOADERS" | jq -r '.[keys[0]]' 2>/dev/null)

        release_type=${RELEASE_TYPE:-release}
        changelog_description=${CHANGELOG_DESCRIPTION}
        [ -n "$CHANGELOG_DEV" ] && changelog_description="$CHANGELOG_DEV"

        if [[ "$DEV_ENVIRONMENT" == "true" ]]; then
          project_version="build_#${GITHUB_RUN_NUMBER}"
          make_release=false
          make_pr=$([[ "$TAG_EXISTS" == "false" ]] && echo true || echo false)
        else
          base_version=${CHANGELOG_VERSION:-$PAKKU_VERSION}
          project_version=${base_version:-v0.0.0}
          make_release=$([[ "$TAG_EXISTS" == "false" ]] && echo true || echo false)
          make_pr=false
        fi

        project_name=${PROJECT_NAME:-Modpack}
        project_full_name="${project_name}-${project_version}"

        echo "project_name=$project_name" >> $GITHUB_OUTPUT
        echo "project_version=$project_version" >> $GITHUB_OUTPUT
        echo "project_full_name=$project_full_name" >> $GITHUB_OUTPUT
        echo "release_type=$release_type" >> $GITHUB_OUTPUT
        echo "minecraft_version=${mc_version:-unknown}" >> $GITHUB_OUTPUT
        echo "loader_type=${loader_type:-unknown}" >> $GITHUB_OUTPUT
        echo "loader_version=${loader_version:-unknown}" >> $GITHUB_OUTPUT
        echo "make_release=$make_release" >> $GITHUB_OUTPUT
        echo "make_pr=$make_pr" >> $GITHUB_OUTPUT

        changelog_payload="$changelog_description"
        if [[ -z "$changelog_payload" ]]; then
          changelog_payload="No changelog available."
        fi
        {
          echo 'description<<EOF'
          echo "$changelog_payload"
          echo EOF
        } >> $GITHUB_OUTPUT

    - name: "📝 GitHub Summary"
      uses: WcAServices/markdown-template-action@v1.1.1
      with:
        template: |
          📃 **Name**: ${{ steps.meta.outputs.project_name }}
          📃 **Release**: `${{ steps.meta.outputs.project_version }}`
          📃 **Release Type**: `${{ steps.meta.outputs.release_type }}`
          📃 **Game Version**: `${{ steps.meta.outputs.minecraft_version }}`
          📃 **Loader Type**: `${{ steps.meta.outputs.loader_type }}`
          📃 **Loader Version**: `${{ steps.meta.outputs.loader_version }}`

          📃 **Dev Environment**: `${{ steps.env_flags.outputs.dev_env }}`
          📃 **Tag Exists**: `${{ steps.tag_check.outputs.exists }}`
          📃 **Make Pull Request**: `${{ steps.meta.outputs.make_pr }}`
          📃 **Make Release**: `${{ steps.meta.outputs.make_release }}`

          ${{ steps.collect_changelog_dev.outputs.description }}
          ${{ steps.read_diff.outputs.diff }}
