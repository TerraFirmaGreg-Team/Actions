name: "Mod: Info"
description: "gradle.properties metadata + tag check"

inputs:
  properties_file:
    required: false
    default: "gradle.properties"
  required_files:
    required: false
    default: "gradle.properties, build.gradle, README.md, src"
  platforms_dir:
    description: "Dir with per-platform subprojects ('auto' tries projects then modules; '' = single-version)"
    required: false
    default: "auto"

outputs:
  name:
    value: ${{ steps.check.outputs.name }}
  version:
    value: ${{ steps.check.outputs.version }}
  version_type:
    value: ${{ steps.check.outputs.version_type }}
  full_name:
    value: ${{ steps.check.outputs.full_name }}
  loaders:
    value: ${{ steps.check.outputs.loaders }}
  loaders_version:
    value: ${{ steps.check.outputs.loaders_version }}
  game_versions:
    value: ${{ steps.check.outputs.game_versions }}
  java_version:
    value: ${{ steps.check.outputs.java_version }}
  java_versions:
    description: "Root + platform java versions, multiline"
    value: ${{ steps.discover.outputs.java_versions }}
  platforms:
    description: "JSON array of publishable platforms for matrix"
    value: ${{ steps.discover.outputs.platforms }}
  exists:
    value: ${{ steps.tag_check.outputs.exists }}
  make_release:
    value: ${{ steps.check.outputs.make_release }}

runs:
  using: "composite"
  steps:
    - name: "Checkout"
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: "Check required files"
      uses: andstor/file-existence-action@v3.1.0
      with:
        fail: true
        ignore_case: true
        files: ${{ inputs.required_files }}

    - name: "Read gradle.properties"
      id: project_info
      uses: madhead/read-java-properties@latest
      with:
        file: ${{ inputs.properties_file }}
        all: true

    - name: "Check if tag exists"
      id: tag_check
      uses: mukunku/tag-exists-action@v1.7.0
      with:
        tag: ${{ steps.project_info.outputs.mod_version }}

    - name: "Compute metadata"
      id: check
      shell: bash
      run: |
        TAG_EXISTS="${{ steps.tag_check.outputs.exists }}"
        SUFFIX="${{ steps.project_info.outputs.mod_name_suffix }}"
        PROJECT_NAME="${{ steps.project_info.outputs.mod_name }}"
        [ -n "$SUFFIX" ] && PROJECT_NAME="${PROJECT_NAME}-${SUFFIX}"

        if [ "$TAG_EXISTS" = "false" ] && [ -n "${{ steps.project_info.outputs.mod_version }}" ]; then
          make_release=true
          version="${{ steps.project_info.outputs.mod_version }}"
          version_type="${{ steps.project_info.outputs.mod_version_type }}"
        else
          make_release=false
          version="${{ steps.project_info.outputs.mod_version }}-build-${GITHUB_RUN_NUMBER}"
          version_type="Unreleased"
        fi

        echo "name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "version_type=$version_type" >> "$GITHUB_OUTPUT"
        echo "full_name=${PROJECT_NAME}-${version}" >> "$GITHUB_OUTPUT"
        echo "loaders=${{ steps.project_info.outputs.loader }}" >> "$GITHUB_OUTPUT"
        echo "loaders_version=${{ steps.project_info.outputs.loader_version || steps.project_info.outputs.forge_version }}" >> "$GITHUB_OUTPUT"
        echo "game_versions=${{ steps.project_info.outputs.minecraft_version }}" >> "$GITHUB_OUTPUT"
        echo "java_version=${{ steps.project_info.outputs.java_version }}" >> "$GITHUB_OUTPUT"
        echo "exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"
        echo "make_release=$make_release" >> "$GITHUB_OUTPUT"

    - name: "Discover platforms"
      id: discover
      shell: bash
      run: |
        DIR="${{ inputs.platforms_dir }}"
        if [ "$DIR" = "auto" ]; then
          DIR=""
          for d in projects modules; do
            [ -d "$d" ] && DIR="$d" && break
          done
        elif [ -n "$DIR" ] && [ ! -d "$DIR" ]; then
          echo "::error::platforms_dir '$DIR' not found"
          exit 1
        fi

        prop() { grep -E "^[[:space:]]*$2[[:space:]]*=" "$1" | head -n1 | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]+$//' | tr -d '\r'; }

        NAME="${{ steps.check.outputs.name }}"
        platforms="[]"
        javas=""
        add_java() { [ -n "$1" ] && [[ $'\n'"$javas"$'\n' != *$'\n'"$1"$'\n'* ]] && javas="${javas:+$javas$'\n'}$1" || true; }
        add_java "${{ steps.project_info.outputs.java_version }}"

        if [ -n "$DIR" ]; then
          for f in "$DIR"/*/gradle.properties; do
            [ -f "$f" ] || continue
            suffix="$(prop "$f" mod_name_suffix)"
            loader="$(prop "$f" loader)"
            mc="$(prop "$f" minecraft_version)"
            [ -n "$suffix" ] && [ -n "$loader" ] && [ -n "$mc" ] || continue
            id="$(basename "$(dirname "$f")")"
            java="$(prop "$f" java_version)"
            platforms="$(jq -c \
              --arg id "$id" --arg base "${NAME}-${suffix}" --arg suffix "$suffix" \
              --arg loader "$loader" --arg mc "$mc" --arg java "$java" \
              '. + [{id: $id, base: $base, suffix: $suffix, loader: $loader, game_versions: $mc, java: $java}]' <<< "$platforms")"
            add_java "$java"
          done
        fi

        if [ "$platforms" = "[]" ]; then
          platforms="$(jq -cn \
            --arg base "$NAME" --arg suffix "${{ steps.project_info.outputs.mod_name_suffix }}" \
            --arg loader "${{ steps.project_info.outputs.loader }}" --arg mc "${{ steps.project_info.outputs.minecraft_version }}" \
            --arg java "${{ steps.project_info.outputs.java_version }}" \
            '[{id: "main", base: $base, suffix: $suffix, loader: $loader, game_versions: $mc, java: $java}]')"
        fi

        echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
        {
          echo 'java_versions<<EOF'
          echo "$javas"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - name: "Summary"
      uses: WcAServices/markdown-template-action@v1.1.1
      with:
        template: |
          | Parameter | Value |
          |-----------|-------|
          | **Name** | `${{ steps.check.outputs.name }}` |
          | **Version** | `${{ steps.check.outputs.version }}` |
          | **Release Type** | `${{ steps.check.outputs.version_type }}` |
          | **Game Versions** | `${{ steps.check.outputs.game_versions }}` |
          | **Loaders** | `${{ steps.check.outputs.loaders }}` |
          | **Loaders Version** | `${{ steps.check.outputs.loaders_version }}` |
          | **Tag Exists** | `${{ steps.check.outputs.exists }}` |
          | **Make Release** | `${{ steps.check.outputs.make_release }}` |
          | **Platforms** | `${{ steps.discover.outputs.platforms }}` |
