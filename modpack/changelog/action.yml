name: "Modpack: Changelog"
description: "Sync GitHub release notes into the wiki changelog (PR + automerge)"

inputs:
  pack:
    description: "Changelog folder: content/changelog/<pack>/en_us"
    required: true
  repo:
    description: "Repository to read releases from (owner/name)"
    required: true
  tag:
    description: "Published release tag to sync"
    required: true
  wiki_owner:
    required: false
    default: "TerraFirmaGreg-Team"
  wiki_repo:
    description: "Wiki repository name (without owner)"
    required: false
    default: "Wiki"
  wiki_branch:
    description: "Wiki branch to sync changelogs into"
    required: false
    default: "dev"
  app_id:
    description: "GitHub App client id installed on the wiki repo"
    required: true
  app_private_key:
    description: "GitHub App private key"
    required: true

runs:
  using: "composite"
  steps:
    - name: "Generate GitHub App Token"
      id: token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ inputs.wiki_owner }}
        repositories: ${{ inputs.wiki_repo }}

    - name: "Checkout wiki"
      uses: actions/checkout@v7.0.1
      with:
        repository: ${{ inputs.wiki_owner }}/${{ inputs.wiki_repo }}
        token: ${{ steps.token.outputs.token }}
        ref: ${{ inputs.wiki_branch }}
        path: wiki

    - name: "Write changelog files"
      uses: actions/github-script@v9.0.0
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('node:fs');
          const path = require('node:path');
          const pack = '${{ inputs.pack }}';
          const [owner, name] = '${{ inputs.repo }}'.split('/');
          const dir = path.join('wiki', 'content', 'changelog', pack, 'en_us');
          const tag = process.env.RELEASE_TAG;
          if (!tag) {
            core.setFailed('Release tag is required');
            return;
          }
          const { data: release } = await github.rest.repos.getReleaseByTag({
            owner, repo: name, tag,
          });
          if (release.draft) {
            core.setFailed(`Release ${tag} is still a draft`);
            return;
          }
          fs.mkdirSync(dir, { recursive: true });
          const fileName = (tag) =>
            tag.replace(/^v/i, '').replace(/[^\w.\-]/g, '-');
          const STRIP_HEADING = /^#{1,6}\s*(what'?s changed|new contributors)\s*$/i;
          const cleanBody = (body) => {
            const out = [];
            let skip = false;
            for (const line of (body ?? '').replace(/\r\n/g, '\n').split('\n')) {
              if (/^#{1,6}\s/.test(line)) {
                skip = STRIP_HEADING.test(line);
                if (skip) continue;
              }
              if (skip) continue;
              if (/^\*\*Full Changelog\*\*/i.test(line.trim())) continue;
              out.push(line);
            }
            return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
          };
          const file = `${fileName(release.tag_name)}.md`;
          const title = release.tag_name
            .replace(/^v/i, '')
            .replaceAll("'", "''");
          const date = new Date(
            release.published_at ?? release.created_at,
          ).toISOString().slice(0, 10);
          fs.writeFileSync(
            path.join(dir, file),
            `---\ntitle: '${title}'\ndate: ${date}\n---\n\n${cleanBody(release.body)}\n`,
            'utf8',
          );
          core.info(`${pack}: release ${release.tag_name} written to ${dir}/${file}`);

    - name: "Commit changelog branch"
      id: commit
      shell: bash
      working-directory: wiki
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -B "changelog/${{ inputs.pack }}"
        git add "content/changelog/${{ inputs.pack }}"
        if git diff --cached --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "no changelog changes"
        else
          git commit -m "docs(changelog): ${{ inputs.pack }} ${{ inputs.tag }}"
          git push --force-with-lease -u origin "changelog/${{ inputs.pack }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: "Create PR"
      id: pr
      if: steps.commit.outputs.changed == 'true'
      uses: TerraFirmaGreg-Team/Actions/pull-request/create@main
      with:
        repository: ${{ inputs.wiki_owner }}/${{ inputs.wiki_repo }}
        repository_path: wiki
        source_branch: changelog/${{ inputs.pack }}
        target_branch: ${{ inputs.wiki_branch }}
        title: "docs(changelog): ${{ inputs.pack }} ${{ inputs.tag }}"
        body: "Automated changelog sync for **${{ inputs.pack }}**."
        draft: "false"
        github_token: ${{ steps.token.outputs.token }}

    - name: "Automerge PR"
      if: steps.commit.outputs.changed == 'true' && steps.pr.outputs.pr_number != ''
      uses: TerraFirmaGreg-Team/Actions/pull-request/automerge@main
      with:
        github_token: ${{ steps.token.outputs.token }}
        repository: ${{ inputs.wiki_owner }}/${{ inputs.wiki_repo }}
        pull_request: ${{ steps.pr.outputs.pr_number }}
        merge_method: squash
        auto_merge: "false"
        delete_branch: "true"
