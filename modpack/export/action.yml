name: "Modpack: Export"
description: "Live game-exporter dump via HeadlessMC (env-driven prod defaults)"

inputs:
  mc_version:
    required: true
  loader_type:
    required: true
  platform:
    description: "Pack id + exporter jar flavor (modern|vintage)"
    required: true
  pack_id:
    description: "Dump pack id → EXPORT_PACK_ID; empty = platform"
    required: false
    default: ""
  version:
    description: "Dump version → EXPORT_VERSION"
    required: true
  namespace:
    description: "Dump namespace → EXPORT_NAMESPACE"
    required: false
    default: "tfg"
  exclude_mods:
    description: "Mod ids CSV excluded from dump → EXPORT_EXCLUDE_MODS"
    required: false
    default: ""
  pack_artifact:
    description: "Built multimc artifact name"
    required: true
  exporter_repo:
    required: false
    default: "TerraFirmaGreg-Team/Game-Exporter"
  exporter_version:
    required: false
    default: "latest"
  exporter_file:
    required: false
    default: ""
  exporter_token:
    required: false
    default: ""
  output_dir:
    required: false
    default: "export"
  java_version:
    required: false
    default: "25"
  xvfb:
    required: false
    default: "true"
  dummy_assets:
    required: false
    default: "false"
  headlessmc_command:
    required: false
    default: '--jvm "-Djava.awt.headless=true -Xmx16G -Xms8G"'
  timeout_seconds:
    description: "Dump timeout → EXPORT_TIMEOUT_SECONDS"
    required: false
    default: "14400"
  dump_s3_endpoint:
    required: false
    default: ""
  dump_s3_bucket:
    required: false
    default: ""
  dump_s3_prefix:
    required: false
    default: ""
  dump_s3_region:
    required: false
    default: ""
  dump_s3_access_key:
    required: false
    default: ""
  dump_s3_secret_key:
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: "Download built pack"
      uses: actions/download-artifact@v8.0.2
      with:
        name: ${{ inputs.pack_artifact }}
        path: pack

    - name: "Prepare run dir"
      shell: bash
      run: |
        mkdir -p pack-unzip run
        unzip -oq pack/*.zip -d pack-unzip
        cp -rf pack-unzip/.minecraft/. run/

    - name: "Download game-exporter"
      uses: dsaltares/fetch-gh-release-asset@1.1.2
      with:
        repo: ${{ inputs.exporter_repo }}
        version: ${{ inputs.exporter_version }}
        file: ${{ inputs.exporter_file || format('game-exporter-{0}.jar', inputs.platform) }}
        target: run/mods/game-exporter.jar
        token: ${{ inputs.exporter_token || github.token }}

    - name: "Run live export"
      uses: headlesshq/mc-runtime-test@5.0.0
      env:
        EXPORT_OUTPUT_DIR: ${{ inputs.output_dir }}
        EXPORT_VERSION: ${{ inputs.version }}
        EXPORT_EXIT_AFTER_DUMP: "true"
        EXPORT_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        EXPORT_PACK_ID: ${{ inputs.pack_id || inputs.platform }}
        EXPORT_NAMESPACE: ${{ inputs.namespace }}
        EXPORT_EXCLUDE_MODS: ${{ inputs.exclude_mods }}
        DUMP_STORAGE_TYPE: ${{ inputs.dump_s3_endpoint != '' && 's3' || 'off' }}
        DUMP_S3_ENDPOINT: ${{ inputs.dump_s3_endpoint }}
        DUMP_S3_BUCKET: ${{ inputs.dump_s3_bucket }}
        DUMP_S3_PREFIX: ${{ inputs.dump_s3_prefix }}
        DUMP_S3_REGION: ${{ inputs.dump_s3_region }}
        DUMP_S3_ACCESS_KEY: ${{ inputs.dump_s3_access_key }}
        DUMP_S3_SECRET_KEY: ${{ inputs.dump_s3_secret_key }}
      with:
        mc: ${{ inputs.mc_version }}
        modloader: ${{ inputs.loader_type }}
        java: ${{ inputs.java_version }}
        xvfb: ${{ inputs.xvfb }}
        dummy-assets: ${{ inputs.dummy_assets }}
        mc-runtime-test: none
        headlessmc-command: ${{ inputs.headlessmc_command }}
