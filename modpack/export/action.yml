name: "Modpack: Export"
description: "Live game-exporter dump via HeadlessMC (env-driven prod defaults)"

inputs:
  mc_version:
    required: true
  loader_type:
    required: true
  platform:
    description: "Pack id + exporter jar flavor (modern|vintage)"
    required: true
  pack_id:
    description: "Dump pack id → EXPORT_PACK_ID; empty = platform"
    required: false
    default: ""
  version:
    description: "Dump version → EXPORT_VERSION; with no pack_artifact doubles as the release tag to fetch the pack from (empty = latest release)"
    required: false
    default: ""
  namespace:
    description: "Dump namespace → EXPORT_NAMESPACE"
    required: false
    default: "tfg"
  exclude_mods:
    description: "Mod ids CSV excluded from dump → EXPORT_EXCLUDE_MODS"
    required: false
    default: ""
  pack_artifact:
    description: "Built multimc artifact name (same-run pack); empty = fetch *-multimc.zip from the release tagged by version"
    required: false
    default: ""
  exporter_repo:
    required: false
    default: "TerraFirmaGreg-Team/Game-Exporter"
  exporter_version:
    required: false
    default: "latest"
  exporter_file:
    description: "Asset name or glob pattern (default Game-Exporter-<Platform>-*.jar)"
    required: false
    default: ""
  exporter_token:
    required: false
    default: ""
  output_dir:
    required: false
    default: "export"
  java_version:
    required: false
    default: "25"
  xvfb:
    required: false
    default: "true"
  dummy_assets:
    required: false
    default: "false"
  headlessmc_command:
    required: false
    default: '--jvm "-Djava.awt.headless=true -Xmx8G -Xms4G -XX:ActiveProcessorCount=3"'
  timeout_seconds:
    description: "Dump timeout → EXPORT_TIMEOUT_SECONDS"
    required: false
    default: "14400"
  dump_s3_endpoint:
    required: false
    default: ""
  dump_s3_bucket:
    required: false
    default: ""
  dump_s3_prefix:
    required: false
    default: ""
  dump_s3_region:
    required: false
    default: ""
  dump_s3_access_key:
    required: false
    default: ""
  dump_s3_secret_key:
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: "Download built pack"
      if: ${{ inputs.pack_artifact != '' }}
      uses: actions/download-artifact@v8.0.2
      with:
        name: ${{ inputs.pack_artifact }}
        path: pack

    - name: "Resolve release tag"
      if: ${{ inputs.pack_artifact == '' }}
      id: tag
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eo pipefail
        mkdir -p pack
        TAG="${{ inputs.version }}"
        [ -n "$TAG" ] || TAG="$(gh api "repos/${{ github.repository }}/releases?per_page=10" -q '[.[] | select(.draft | not)][0].tag_name')"
        [ -n "$TAG" ] && [ "$TAG" != "null" ] \
          || { echo "::error::No published releases found — pass version explicitly"; exit 1; }
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "Release tag: $TAG"

    - name: "Fetch released pack"
      if: ${{ inputs.pack_artifact == '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" --pattern "*-multimc.zip" --dir pack --clobber

    - name: "Resolve dump version"
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eo pipefail
        ls pack/*-multimc.zip >/dev/null \
          || { echo "::error::No *-multimc.zip in pack/ — check pack_artifact/version"; exit 1; }
        V="${{ inputs.version }}"
        [ -z "$V" ] && V="${{ steps.tag.outputs.tag }}"
        [ -z "$V" ] && V="dev"
        echo "version=$V" >> "$GITHUB_OUTPUT"
        LATEST=""
        [ -z "${{ inputs.version }}" ] && LATEST="${{ steps.tag.outputs.tag }}"
        [ -n "$LATEST" ] || LATEST="$(gh api "repos/${{ github.repository }}/releases?per_page=10" -q '[.[] | select(.draft | not)][0].tag_name' || true)"
        [ "$V" = "$LATEST" ] && echo "update_latest=1" >> "$GITHUB_OUTPUT" || echo "update_latest=0" >> "$GITHUB_OUTPUT"
        echo "Dump version: $V (latest release: ${LATEST:-none})"

    - name: "Prepare run dir"
      shell: bash
      run: |
        mkdir -p pack-unzip run
        unzip -oq pack/*.zip -d pack-unzip
        cp -rf pack-unzip/.minecraft/. run/
        [ -f run/config/ftbbackups2.json ] \
          && sed -i 's/"enabled" *: *true/"enabled": false/' run/config/ftbbackups2.json || true
        [ -f run/config/ftbbackups.cfg ] \
          && sed -i 's/B:enabled *= *true/B:enabled=false/' run/config/ftbbackups.cfg || true

    - name: "Setup Java"
      uses: actions/setup-java@v6.1.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java_version }}

    - name: "Pin game JVM"
      shell: bash
      run: |
        mkdir -p HeadlessMC/profiles
        cat <<EOF >> HeadlessMC/config.properties
        hmc.java.download=false
        hmc.java.versions=$JAVA_HOME/bin/java
        EOF
        # HMC 3 has no --java flag: launch resolves a saved profile whose
        # "version" matches <loader> <mc>; its javaVersion wins over version.json.
        cat <<EOF > "HeadlessMC/profiles/${{ inputs.loader_type }}-${{ inputs.mc_version }}.json"
        {
          "name": "${{ inputs.loader_type }}-${{ inputs.mc_version }}",
          "version": {"platform": "${{ inputs.loader_type }}", "version": "${{ inputs.mc_version }}"},
          "currentVersion": {"platform": "${{ inputs.loader_type }}", "version": "${{ inputs.mc_version }}"},
          "path": "$PWD/run",
          "options": {"resolution": null, "quickPlayPath": null, "join": null, "demo": false},
          "patchers": [],
          "systemProperties": {},
          "vmArgs": [],
          "javaVersion": ${{ inputs.java_version }},
          "eulaStatus": "UNKNOWN",
          "hasDefaultClientJvmArgs": false,
          "hmcVersion": 0
        }
        EOF

    - name: "Download game-exporter"
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.exporter_token || github.token }}
      run: |
        VER="${{ inputs.exporter_version }}"
        [ "$VER" != "latest" ] || VER="$(gh release view --repo "${{ inputs.exporter_repo }}" --json tagName -q .tagName)"
        FILE="${{ inputs.exporter_file }}"
        [ -n "$FILE" ] || FILE="${{ format('Game-Exporter-{0}-*.jar', inputs.platform == 'vintage' && 'Vintage' || 'Modern') }}"
        gh release download "$VER" --repo "${{ inputs.exporter_repo }}" --pattern "$FILE" --output run/mods/game-exporter.jar --clobber
        ls -lh run/mods/game-exporter.jar

    - name: "Run live export"
      uses: headlesshq/mc-runtime-test@5.0.0
      env:
        EXPORT_OUTPUT_DIR: ${{ inputs.output_dir }}
        EXPORT_VERSION: ${{ steps.resolve.outputs.version }}
        EXPORT_EXIT_AFTER_DUMP: "true"
        EXPORT_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        EXPORT_PACK_ID: ${{ inputs.pack_id || inputs.platform }}
        EXPORT_NAMESPACE: ${{ inputs.namespace }}
        EXPORT_EXCLUDE_MODS: ${{ inputs.exclude_mods }}
        DUMP_STORAGE_TYPE: ${{ inputs.dump_s3_endpoint != '' && 's3' || 'off' }}
        DUMP_S3_ENDPOINT: ${{ inputs.dump_s3_endpoint }}
        DUMP_S3_BUCKET: ${{ inputs.dump_s3_bucket }}
        DUMP_S3_PREFIX: ${{ inputs.dump_s3_prefix }}
        DUMP_S3_REGION: ${{ inputs.dump_s3_region }}
        DUMP_S3_ACCESS_KEY: ${{ inputs.dump_s3_access_key }}
        DUMP_S3_SECRET_KEY: ${{ inputs.dump_s3_secret_key }}
        DUMP_UPDATE_LATEST: ${{ steps.resolve.outputs.update_latest }}
      with:
        mc: ${{ inputs.mc_version }}
        modloader: ${{ inputs.loader_type }}
        java: ${{ inputs.java_version }}
        xvfb: ${{ inputs.xvfb }}
        dummy-assets: ${{ inputs.dummy_assets }}
        mc-runtime-test: none
        headlessmc-command: ${{ inputs.headlessmc_command }}
