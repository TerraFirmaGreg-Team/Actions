name: "Modpack: Release"
description: "Publish modpack via game-publish"

inputs:
  project_full_name:
    required: true
  project_version:
    required: true
  release_type:
    required: false
    default: "release"
  changelog:
    required: false
    default: ""
  diff:
    required: false
    default: ""
  mc_version:
    required: false
    default: ""
  loader_type:
    required: false
    default: ""
  files:
    description: "Extra release assets, multiline"
    required: false
    default: ""
  environment:
    required: false
    default: "client | server"
  curseforge_server_name:
    required: false
    default: ""
  github_token:
    required: true
  curseforge_id:
    required: false
    default: ""
  curseforge_token:
    required: false
    default: ""
  enable_modrinth:
    required: false
    default: "false"
  modrinth_id:
    required: false
    default: ""
  modrinth_token:
    required: false
    default: ""

outputs:
  curseforge-id:
    value: ${{ steps.publish.outputs.curseforge-id || steps.publish_mr.outputs.curseforge-id }}
  curseforge-url:
    value: ${{ steps.publish.outputs.curseforge-url || steps.publish_mr.outputs.curseforge-url }}
  github-tag:
    value: ${{ steps.publish.outputs.github-tag || steps.publish_mr.outputs.github-tag }}
  github-url:
    value: ${{ steps.publish.outputs.github-url || steps.publish_mr.outputs.github-url }}

runs:
  using: "composite"
  steps:
    - name: "Checkout"
      uses: actions/checkout@v7.0.1

    - name: "Download artifacts"
      uses: actions/download-artifact@v8.0.2
      with:
        merge-multiple: true

    - name: "Publish"
      id: publish
      if: ${{ inputs.enable_modrinth != 'true' }}
      uses: Xikaro/game-publish@main
      with:
        curseforge-id: ${{ inputs.curseforge_id }}
        curseforge-token: ${{ inputs.curseforge_token }}
        curseforge-files: ${{ inputs.project_full_name }}-curseforge.zip
        curseforge-server-files: ${{ inputs.project_full_name }}-serverpack.zip
        curseforge-server-name: ${{ inputs.curseforge_server_name }}
        github-tag: ${{ inputs.project_version }}
        github-token: ${{ inputs.github_token }}
        files: ${{ inputs.files }}
        name: ${{ inputs.project_full_name }}
        version: ${{ inputs.project_version }}
        version-type: ${{ inputs.release_type }}
        loaders: ${{ inputs.loader_type }}
        game-versions: ${{ inputs.mc_version }}
        environment: ${{ inputs.environment }}
        rollback: true
        changelog: |
          ${{ inputs.changelog }}
          ${{ inputs.diff }}
        changelog-format: markdown
        retry-attempts: 2
        retry-delay: 10000
        fail-mode: fail

    - name: "Publish (with Modrinth)"
      id: publish_mr
      if: ${{ inputs.enable_modrinth == 'true' }}
      uses: Xikaro/game-publish@main
      with:
        modrinth-id: ${{ inputs.modrinth_id }}
        modrinth-token: ${{ inputs.modrinth_token }}
        modrinth-files: ${{ inputs.project_full_name }}-modrinth.mrpack
        curseforge-id: ${{ inputs.curseforge_id }}
        curseforge-token: ${{ inputs.curseforge_token }}
        curseforge-files: ${{ inputs.project_full_name }}-curseforge.zip
        curseforge-server-files: ${{ inputs.project_full_name }}-serverpack.zip
        curseforge-server-name: ${{ inputs.curseforge_server_name }}
        github-tag: ${{ inputs.project_version }}
        github-token: ${{ inputs.github_token }}
        files: ${{ inputs.files }}
        name: ${{ inputs.project_full_name }}
        version: ${{ inputs.project_version }}
        version-type: ${{ inputs.release_type }}
        loaders: ${{ inputs.loader_type }}
        game-versions: ${{ inputs.mc_version }}
        environment: ${{ inputs.environment }}
        rollback: true
        changelog: |
          ${{ inputs.changelog }}
          ${{ inputs.diff }}
        changelog-format: markdown
        retry-attempts: 2
        retry-delay: 10000
        fail-mode: fail
