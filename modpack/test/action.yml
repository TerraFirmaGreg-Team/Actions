name: "Modpack: Test"
description: "HeadlessMC client + server smoke tests; summary, logs, PR comment on failure"

inputs:
  mc_version:
    required: true
  loader_type:
    required: true
  loader_version:
    description: "Pinned loader build for the server test (e.g. 47.4.13); empty = latest"
    required: false
    default: ""
  pack_artifact:
    description: "Built multimc artifact name; required for mode=both|client"
    required: false
    default: ""
  server_artifact:
    description: "Built serverpack artifact name; empty = skip server test"
    required: false
    default: ""
  pr_number:
    description: "PR to comment on failure; empty = current pull_request event"
    required: false
    default: ""
  test_mod:
    description: "forge|lexforge|neoforge|fabric|none"
    required: false
    default: "forge"
  java_version:
    required: false
    default: "17"
  xvfb:
    required: false
    default: "true"
  dummy_assets:
    required: false
    default: "true"
  headlessmc_command:
    required: false
    default: '--jvm "-Djava.awt.headless=true -XX:ActiveProcessorCount=3"'
  server_headlessmc_command:
    required: false
    default: '--jvm "-Djava.awt.headless=true"'
  artifact_logs:
    required: false
    default: "true"
  artifact_prefix:
    required: false
    default: "modpack-test"
  spark:
    description: "Inject spark mod; collect health metrics + flame graph link for client+server"
    required: false
    default: "true"
  mode:
    description: "both|client|server|report — split phases across jobs for parallel runs"
    required: false
    default: "both"
  client_result:
    description: "mode=report: outcome of the client test job"
    required: false
    default: ""
  server_result:
    description: "mode=report: outcome of the server test job"
    required: false
    default: ""

outputs:
  result:
    description: "clienttest/servertest outcome (mode=client|server)"
    value: ${{ steps.clienttest.outcome || steps.servertest.outcome || 'none' }}

runs:
  using: "composite"
  steps:
    - name: "Download client pack"
      if: ${{ inputs.mode == 'both' || inputs.mode == 'client' }}
      uses: actions/download-artifact@v8.0.2
      with:
        name: ${{ inputs.pack_artifact }}
        path: pack-client

    - name: "Stage client"
      if: ${{ inputs.mode == 'both' || inputs.mode == 'client' }}
      shell: bash
      run: |
        [ -n "${{ inputs.pack_artifact }}" ] \
          || { echo "::error::pack_artifact is required for mode=${{ inputs.mode }}"; exit 1; }
        mkdir -p client-unzip client
        unzip -oq pack-client/*.zip -d client-unzip
        cp -rf client-unzip/.minecraft/. client/
        [ -f client/config/ftbbackups2.json ] \
          && sed -i 's/"enabled" *: *true/"enabled": false/' client/config/ftbbackups2.json || true
        [ -f client/config/ftbbackups.cfg ] \
          && sed -i 's/B:enabled *= *true/B:enabled=false/' client/config/ftbbackups.cfg || true
        # Forge 47.x early display window can't init under headless CI and
        # spams a y/n console prompt — disable it via the documented fml.toml key.
        mkdir -p client/config
        if grep -q 'earlyWindowControl' client/config/fml.toml 2>/dev/null; then
          sed -i 's/^ *earlyWindowControl *= *.*/earlyWindowControl = false/' client/config/fml.toml
        else
          echo 'earlyWindowControl = false' >> client/config/fml.toml
        fi
        echo "CLIENT_RESULT=fail" >> "$GITHUB_ENV"
        echo "SERVER_RESULT=skipped" >> "$GITHUB_ENV"

    - name: "Download server pack"
      if: ${{ inputs.server_artifact != '' && (inputs.mode == 'both' || inputs.mode == 'server') }}
      uses: actions/download-artifact@v8.0.2
      with:
        name: ${{ inputs.server_artifact }}
        path: pack-server

    - name: "Stage server"
      if: ${{ inputs.server_artifact != '' && (inputs.mode == 'both' || inputs.mode == 'server') }}
      shell: bash
      run: |
        mkdir -p server
        unzip -oq pack-server/*.zip -d server
        [ -f server/config/ftbbackups2.json ] \
          && sed -i 's/"enabled" *: *true/"enabled": false/' server/config/ftbbackups2.json || true
        [ -f server/config/ftbbackups.cfg ] \
          && sed -i 's/B:enabled *= *true/B:enabled=false/' server/config/ftbbackups.cfg || true

    - name: "Install spark"
      if: ${{ inputs.spark == 'true' && inputs.mode != 'report' }}
      shell: bash
      run: |
        LOADER="${{ inputs.loader_type }}"
        [ "$LOADER" = "lexforge" ] && LOADER=forge
        URL=$(curl -fsSL "https://api.modrinth.com/v2/project/spark/version?loaders=%5B%22${LOADER}%22%5D&game_versions=%5B%22${{ inputs.mc_version }}%22%5D" \
          | jq -r '.[0].files[] | select(.primary == true) | .url' | head -1) || URL=""
        if [ -z "$URL" ]; then
          echo "::warning::spark jar download failed — spark stats disabled"
          exit 0
        fi
        for d in client server; do
          [ -d "$d/mods" ] && curl -fsSL -o "$d/mods/spark-ci.jar" "$URL" && echo "$d: $(basename "$URL")" || true
        done
        # kubejs script runs spark commands — only after a successful download,
        # otherwise unknown-command errors would pollute the kubejs log.
        [ -d client/kubejs/server_scripts ] \
          && cp "${{ github.action_path }}/data/ci-spark.js" client/kubejs/server_scripts/ || true

    - name: "Setup Java"
      if: ${{ inputs.mode != 'report' }}
      uses: actions/setup-java@v6.1.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java_version }}

    - name: "Pin game JVM"
      if: ${{ inputs.mode == 'both' || inputs.mode == 'client' }}
      shell: bash
      run: |
        ln -sfn client run
        mkdir -p HeadlessMC/profiles
        cat <<EOF >> HeadlessMC/config.properties
        hmc.java.download=false
        hmc.java.versions=$JAVA_HOME/bin/java
        EOF
        # HMC 3 has no --java flag: launch resolves a saved profile whose
        # "version" matches <loader> <mc>; its javaVersion wins over version.json.
        cat <<EOF > "HeadlessMC/profiles/${{ inputs.loader_type }}-${{ inputs.mc_version }}.json"
        {
          "name": "${{ inputs.loader_type }}-${{ inputs.mc_version }}",
          "version": {"platform": "${{ inputs.loader_type }}", "version": "${{ inputs.mc_version }}"},
          "currentVersion": {"platform": "${{ inputs.loader_type }}", "version": "${{ inputs.mc_version }}"},
          "path": "$PWD/run",
          "options": {"resolution": null, "quickPlayPath": null, "join": null, "demo": false},
          "patchers": [],
          "systemProperties": {},
          "vmArgs": [],
          "javaVersion": ${{ inputs.java_version }},
          "eulaStatus": "UNKNOWN",
          "hasDefaultClientJvmArgs": false,
          "hmcVersion": 0
        }
        EOF

    - name: "Client test"
      id: clienttest
      if: ${{ inputs.mode == 'both' || inputs.mode == 'client' }}
      uses: headlesshq/mc-runtime-test@5.0.0
      with:
        mc: ${{ inputs.mc_version }}
        modloader: ${{ inputs.loader_type }}
        java: ${{ inputs.java_version }}
        xvfb: ${{ inputs.xvfb }}
        dummy-assets: ${{ inputs.dummy_assets }}
        mc-runtime-test: ${{ inputs.test_mod }}
        cache-mc: github
        headlessmc-command: ${{ inputs.headlessmc_command }}

    - name: "Mark client pass"
      if: ${{ steps.clienttest.outcome == 'success' }}
      shell: bash
      run: echo "CLIENT_RESULT=pass" >> "$GITHUB_ENV"

    - name: "Pin server JVM"
      if: ${{ always() && inputs.server_artifact != '' && (inputs.mode == 'both' || inputs.mode == 'server') }}
      shell: bash
      run: |
        # `server add` pins profile javaVersion from the vanilla version.json;
        # a pre-seeded patched file makes the server launch use our JVM.
        # Requires cache-mc: 'false' below — a cache restore would clobber this file.
        ln -sfn server run
        VJ="$HOME/.minecraft/versions/${{ inputs.mc_version }}/${{ inputs.mc_version }}.json"
        mkdir -p "$(dirname "$VJ")"
        URL="$(curl -fsSL "https://launchermeta.mojang.com/mc/game/version_manifest_v2.json" \
          | jq -r --arg v "${{ inputs.mc_version }}" '.versions[] | select(.id == $v) | .url')"
        [ -n "$URL" ] || { echo "::error::No ${{ inputs.mc_version }} in Mojang version manifest"; exit 1; }
        curl -fsSL "$URL" | jq '.javaVersion.majorVersion = ${{ inputs.java_version }}' > "$VJ"
        jq '.javaVersion' "$VJ"

    - name: "Server test"
      id: servertest
      if: ${{ always() && inputs.server_artifact != '' && (inputs.mode == 'both' || inputs.mode == 'server') }}
      uses: headlesshq/mc-server-test@2.0.0
      with:
        mc: "${{ inputs.mc_version }} ${{ inputs.loader_version }}"
        modloader: ${{ inputs.loader_type }}
        java: ${{ inputs.java_version }}
        cache-mc: 'false'
        headlessmc-command: ${{ inputs.server_headlessmc_command }}
        test-file: ${{ inputs.spark == 'true' && format('{0}/data/server-test.json', github.action_path) || 'none' }}

    - name: "Mark server pass"
      if: ${{ steps.servertest.outcome == 'success' }}
      shell: bash
      run: echo "SERVER_RESULT=pass" >> "$GITHUB_ENV"

    - name: "Mark server fail"
      if: ${{ steps.servertest.outcome == 'failure' }}
      shell: bash
      run: echo "SERVER_RESULT=fail" >> "$GITHUB_ENV"

    - name: "Download test logs"
      if: ${{ inputs.mode == 'report' }}
      uses: actions/download-artifact@v8.0.2
      with:
        pattern: ${{ inputs.artifact_prefix }}-logs-*
        path: dl
        merge-multiple: true

    - name: "Init report env"
      if: ${{ inputs.mode == 'report' }}
      shell: bash
      run: |
        cp -rf dl/. . && rm -rf dl
        echo "CLIENT_RESULT=${{ inputs.client_result || 'fail' }}" >> "$GITHUB_ENV"
        echo "SERVER_RESULT=${{ inputs.server_result || 'skipped' }}" >> "$GITHUB_ENV"

    - name: "Analyze logs"
      if: ${{ always() && (inputs.mode == 'both' || inputs.mode == 'report') }}
      shell: bash
      run: |
        # Findings-only: log errors are shown to reviewers, never fail the run.
        # Pass/fail comes solely from the test step outcomes.
        bad=0
        : > analysis.md
        for dir in client server; do
          [ -d "$dir/logs" ] || continue
          kerr=$(grep -rsh 'ERROR' $dir/logs/kubejs/*.log 2>/dev/null; grep -h "Error in '" $dir/logs/latest.log 2>/dev/null | head -3 || true)
          if [ -n "$kerr" ]; then
            echo "::warning title=KubeJS errors ($dir)::$(echo "$kerr" | head -5 | tr '\n' ' ')"
            {
              echo "**KubeJS errors ($dir)**:"
              echo '```text'
              echo "$kerr" | head -5
              echo '```'
            } >> analysis.md
            bad=1
          fi
          if grep -sqE 'Mixin apply failed|InjectionError' $dir/logs/latest.log; then
            echo "::warning title=Mixin failure ($dir)::$(grep -m3 -E 'Mixin apply failed|InjectionError' $dir/logs/latest.log | tr '\n' ' ')"
            {
              echo "**Mixin failure ($dir)**:"
              echo '```text'
              grep -m3 -E 'Mixin apply failed|InjectionError' $dir/logs/latest.log
              echo '```'
            } >> analysis.md
            bad=1
          fi
          rec=$(grep -c 'Parsing error loading recipe' $dir/logs/latest.log 2>/dev/null || true)
          if [ "${rec:-0}" -gt 0 ]; then
            echo "::warning title=Recipe parse errors ($dir)::$rec in latest.log"
            echo "- **Recipe parse errors ($dir)**: $rec in latest.log" >> analysis.md
          fi
          dp=$(grep -cE "Couldn't load data tag|Couldn't parse data file" $dir/logs/latest.log 2>/dev/null || true)
          if [ "${dp:-0}" -gt 0 ]; then
            echo "::warning title=Datapack issues ($dir)::$dp in latest.log"
            echo "- **Datapack issues ($dir)**: $dp in latest.log" >> analysis.md
          fi
        done
        [ "$bad" = 1 ] && echo "ANALYZE_BAD=1" >> "$GITHUB_ENV" || true

    - name: "Collect spark profiles"
      if: ${{ always() && (inputs.mode == 'both' || inputs.mode == 'report') }}
      shell: bash
      run: |
        for dir in client server; do
          mkdir -p spark/$dir
          find $dir spark/$dir -name '*.spark' -exec cp -n {} spark/$dir/ \; 2>/dev/null || true
          latest=$(ls -t spark/$dir/*.spark 2>/dev/null | head -1 || true)
          if [ -z "$latest" ]; then
            # Profiler may have auto-uploaded (timeout/crash) — reuse its viewer link.
            u=$(grep -oh 'https://spark\.lucko\.me/[A-Za-z0-9_-]*' $dir/logs/latest.log 2>/dev/null | tail -1 || true)
            if [ -n "$u" ]; then
              echo "SPARK_${dir^^}_LINK=$u" >> "$GITHUB_ENV"
              echo "$dir: $u"
            fi
            continue
          fi
          key=$(gzip -c "$latest" | curl -fsS --max-time 60 -X POST "https://spark-usercontent.lucko.me/post" \
            -H "Content-Type: application/x-spark-sampler" -H "Content-Encoding: gzip" \
            -H "User-Agent: spark-plugin" --data-binary @- -D - -o /dev/null 2>/dev/null \
            | grep -i '^location:' | tr -d '\r' | awk '{print $NF}' || true)
          if [ -n "$key" ]; then
            echo "SPARK_${dir^^}_LINK=https://spark.lucko.me/${key##*/}" >> "$GITHUB_ENV"
            echo "$dir: https://spark.lucko.me/${key##*/}"
          else
            echo "::warning::spark profile upload failed ($dir) — file kept in artifact"
          fi
        done

    - name: "Upload client logs"
      if: ${{ always() && inputs.artifact_logs == 'true' && (inputs.mode == 'both' || inputs.mode == 'client') }}
      id: up-client
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ${{ inputs.artifact_prefix }}-logs-client
        path: |
          client/logs/
          client/crash-reports/
          client/hs_err_pid*.log
          spark/client/
          analysis.md
        if-no-files-found: warn

    - name: "Upload server logs"
      if: ${{ always() && inputs.artifact_logs == 'true' && inputs.server_artifact != '' && (inputs.mode == 'both' || inputs.mode == 'server') }}
      id: up-server
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ${{ inputs.artifact_prefix }}-logs-server
        path: |
          server/logs/
          server/crash-reports/
          server/hs_err_pid*.log
          spark/server/
          analysis.md
        if-no-files-found: warn

    - name: "Test summary"
      if: ${{ always() && (inputs.mode == 'both' || inputs.mode == 'report') }}
      shell: bash
      env:
        CLIENT_LOGS_URL: ${{ steps.up-client.outputs.artifact-url }}
        SERVER_LOGS_URL: ${{ steps.up-server.outputs.artifact-url }}
        HAS_SERVER: ${{ inputs.server_artifact != '' }}
      run: |
        source "${{ github.action_path }}/data/report-lib.sh"
        spark_cell() { [ -n "$1" ] && echo "[flame graph]($1)" || echo "n/a"; }
        logs_cell() {
          local o=""
          [ -n "$CLIENT_LOGS_URL" ] && o="[client]($CLIENT_LOGS_URL)"
          [ -n "$SERVER_LOGS_URL" ] && o+="${o:+ · }[server]($SERVER_LOGS_URL)"
          echo "${o:-n/a}"
        }
        {
          echo "### Runtime test"
          echo ""
          echo "| Check | Result |"
          echo "|---|---|"
          echo "| Client | ${CLIENT_RESULT:-n/a} |"
          echo "| Server | ${SERVER_RESULT:-n/a} |"
          echo "| Spark (client) | $(spark_cell "${SPARK_CLIENT_LINK:-}") |"
          echo "| Spark (server) | $(spark_cell "${SPARK_SERVER_LINK:-}") |"
          echo "| Logs | $(logs_cell) |"
        } >> "$GITHUB_STEP_SUMMARY"
        # When a report is coming it carries the stats — skip duplicating them.
        if ! need_comment; then
          for dir in client server; do
            block=$(spark_stats "$dir/logs/latest.log" 2>/dev/null || true)
            eval "link=\${SPARK_${dir^^}_LINK:-}"
            if [ -n "$block" ] || [ -n "$link" ]; then
              {
                echo ''
                echo "<details><summary><b>spark stats — $dir</b></summary>"
                echo ''
                if [ -n "$block" ]; then
                  echo '```text'
                  echo "$block"
                  echo '```'
                  echo ''
                fi
                [ -n "$link" ] && echo "[Interactive flame graph]($link)" && echo ''
                echo '</details>'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
        fi

    - name: "Upload logs to mclo.gs"
      if: ${{ always() && (inputs.mode == 'both' || inputs.mode == 'report') }}
      shell: bash
      env:
        HAS_SERVER: ${{ inputs.server_artifact != '' }}
      run: |
        source "${{ github.action_path }}/data/report-lib.sh"
        need_comment || exit 0
        upload() { # $1=file $2=env name
          local url
          url=$(tail -24000 "$1" | curl -fsS --max-time 30 -X POST https://api.mclo.gs/1/log \
            --data-urlencode content@- 2>/dev/null | jq -r '.url // empty' 2>/dev/null || true)
          if [ -n "$url" ]; then
            echo "$2=$url" >> "$GITHUB_ENV"
            echo "$2 -> $url"
          else
            echo "::warning::mclo.gs upload failed: $1"
          fi
          return 0
        }
        for dir in client server; do
          [ -d "$dir/logs" ] || continue
          [ -s "$dir/logs/latest.log" ]          && upload "$dir/logs/latest.log"          "MCLOGS_${dir^^}_LATEST"         || true
          [ -s "$dir/logs/kubejs/server.log" ]   && upload "$dir/logs/kubejs/server.log"   "MCLOGS_${dir^^}_KUBEJS"         || true
          [ -s "$dir/logs/kubejs/startup.log" ]  && upload "$dir/logs/kubejs/startup.log"  "MCLOGS_${dir^^}_KUBEJS_STARTUP" || true
          [ -s "$dir/logs/kubejs/client.log" ]   && upload "$dir/logs/kubejs/client.log"   "MCLOGS_${dir^^}_KUBEJS_CLIENT"  || true
          [ -s "$dir/logs/stderr_stream.log" ]   && upload "$dir/logs/stderr_stream.log"   "MCLOGS_${dir^^}_STDERR"         || true
          crash=$(ls -t $dir/crash-reports/*.txt 2>/dev/null | head -1 || true)
          if [ -n "$crash" ] && [ -s "$crash" ]; then
            upload "$crash" "MCLOGS_${dir^^}_CRASH" || true
          fi
          for f in $dir/hs_err_pid*.log; do
            [ -s "$f" ] && upload "$f" "MCLOGS_${dir^^}_HSERR" || true
          done
        done

    - name: "Build failure report"
      if: ${{ always() && (inputs.mode == 'both' || inputs.mode == 'report') }}
      shell: bash
      env:
        CLIENT_LOGS_URL: ${{ steps.up-client.outputs.artifact-url }}
        SERVER_LOGS_URL: ${{ steps.up-server.outputs.artifact-url }}
        HAS_SERVER: ${{ inputs.server_artifact != '' }}
      run: |
        source "${{ github.action_path }}/data/report-lib.sh"
        need_comment || exit 0
        TITLE=$(report_title)
        {
          echo "$TITLE"
          echo ''
          echo "**Client**: ${CLIENT_RESULT:-n/a} · **Server**: ${SERVER_RESULT:-n/a}"
          logs_md
          spark_md
        } > pr-comment-short.md
        {
          echo "$TITLE"
          echo ''
          echo "**Client**: ${CLIENT_RESULT:-n/a} · **Server**: ${SERVER_RESULT:-n/a}"
          logs_md
          spark_md
          echo ''
          found=0
          if [ -s analysis.md ]; then
            echo '<details><summary><b>Findings</b></summary>'
            echo ''
            cat analysis.md
            echo ''
            echo '</details>'
            echo ''
            found=1
          fi
          side_details client "$CLIENT_LOGS_URL"
          side_details server "$SERVER_LOGS_URL"
          if [ "$found" -eq 0 ] && ! compgen -G 'client/logs/*' >/dev/null && ! compgen -G 'server/logs/*' >/dev/null; then
            echo 'No logs found — see workflow log.'
          fi
        } > pr-comment.md
        cat pr-comment.md >> "$GITHUB_STEP_SUMMARY"
        # PR comments cap at 65536 chars — fall back to the short form past 60KB.
        if [ "$(wc -c < pr-comment.md)" -gt 60000 ]; then
          {
            cat pr-comment-short.md
            echo ''
            echo '_Full details too large — see job summary and artifacts._'
          } > pr-comment.md
        fi
        echo "COMMENT=1" >> "$GITHUB_ENV"

    - name: "Verdict"
      if: ${{ always() && inputs.mode == 'report' }}
      shell: bash
      run: |
        # Single gate for callers: report job fails iff a side actually failed
        # (or the server test never ran despite a serverpack being provided).
        fail=0
        [ "$CLIENT_RESULT" = "fail" ] && fail=1
        [ "$SERVER_RESULT" = "fail" ] && fail=1
        { [ "${{ inputs.server_artifact != '' }}" = "true" ] && [ "$SERVER_RESULT" = "skipped" ]; } && fail=1
        [ "$fail" -eq 0 ]

    - name: "Comment PR on failure (summary)"
      if: ${{ env.COMMENT == '1' && (github.event_name == 'pull_request' || inputs.pr_number != '') }}
      uses: mshick/add-pr-comment@v3.12.0
      with:
        issue: ${{ inputs.pr_number || github.event.pull_request.number }}
        message-path: pr-comment-short.md
        message-id: runtime-test

    - name: "Comment PR on failure (details)"
      if: ${{ env.COMMENT == '1' && (github.event_name == 'pull_request' || inputs.pr_number != '') }}
      uses: mshick/add-pr-comment@v3.12.0
      with:
        issue: ${{ inputs.pr_number || github.event.pull_request.number }}
        message-path: pr-comment.md
        message-id: runtime-test
