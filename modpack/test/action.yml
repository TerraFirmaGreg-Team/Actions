name: "Modpack: Test"
description: "HeadlessMC client smoke test; PR comment on failure"

inputs:
  mc_version:
    required: true
  loader_type:
    required: true
  pack_artifact:
    description: "Built multimc artifact name"
    required: true
  pr_number:
    description: "PR to comment on failure; empty = current pull_request event"
    required: false
    default: ""
  test_mod:
    description: "forge|lexforge|neoforge|fabric|none"
    required: false
    default: "forge"
  java_version:
    required: false
    default: "17"
  xvfb:
    required: false
    default: "true"
  dummy_assets:
    required: false
    default: "true"
  headlessmc_command:
    required: false
    default: '--jvm "-Djava.awt.headless=true"'
  artifact_logs:
    required: false
    default: "true"
  artifact_prefix:
    required: false
    default: "modpack-test"

runs:
  using: "composite"
  steps:
    - name: "Download built pack"
      uses: actions/download-artifact@v8.0.2
      with:
        name: ${{ inputs.pack_artifact }}
        path: pack

    - name: "Prepare run dir"
      shell: bash
      run: |
        mkdir -p pack-unzip run
        unzip -oq pack/*.zip -d pack-unzip
        cp -rf pack-unzip/.minecraft/. run/

    - name: "Runtime test"
      uses: headlesshq/mc-runtime-test@5.0.0
      with:
        mc: ${{ inputs.mc_version }}
        modloader: ${{ inputs.loader_type }}
        java: ${{ inputs.java_version }}
        xvfb: ${{ inputs.xvfb }}
        dummy-assets: ${{ inputs.dummy_assets }}
        mc-runtime-test: ${{ inputs.test_mod }}
        headlessmc-command: ${{ inputs.headlessmc_command }}

    - name: "Upload logs"
      if: ${{ always() && inputs.artifact_logs == 'true' }}
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ${{ inputs.artifact_prefix }}-logs
        path: |
          run/logs/
          run/crash-reports/
        if-no-files-found: warn

    - name: "Collect failure details"
      if: ${{ failure() && (github.event_name == 'pull_request' || inputs.pr_number != '') }}
      shell: bash
      run: |
        {
          echo '### Runtime test failed'
          echo '```'
          crash=$(ls -t run/crash-reports/*.txt 2>/dev/null | head -1)
          if [ -n "$crash" ]; then
            head -80 "$crash"
          elif [ -f run/logs/latest.log ]; then
            tail -80 run/logs/latest.log
          else
            echo 'No crash report or latest.log. See attached logs.'
          fi
          echo '```'
        } > pr-comment.md

    - name: "Comment PR on failure"
      if: ${{ failure() && (github.event_name == 'pull_request' || inputs.pr_number != '') }}
      uses: mshick/add-pr-comment@v3.12.0
      with:
        issue: ${{ inputs.pr_number || github.event.pull_request.number }}
        message-path: pr-comment.md
        message-id: runtime-test
        attach-path: run/logs/
        attach-name: ${{ inputs.artifact_prefix }}-logs
        attach-text: '[Download full logs](%ARTIFACT_URL%)'
