name: "Modpack: Test"
description: "HeadlessMC client + server smoke tests; summary, logs, PR comment on failure"

inputs:
  mc_version:
    required: true
  loader_type:
    required: true
  loader_version:
    description: "Pinned loader build for the server test (e.g. 47.4.13); empty = latest"
    required: false
    default: ""
  pack_artifact:
    description: "Built multimc artifact name; empty = skip client test"
    required: false
    default: ""
  server_artifact:
    description: "Built serverpack artifact name; empty = skip server test"
    required: false
    default: ""
  pr_number:
    description: "PR to comment on failure; empty = current pull_request event"
    required: false
    default: ""
  test_mod:
    description: "forge|lexforge|neoforge|fabric|none"
    required: false
    default: "forge"
  test_mod_version:
    description: "mc-runtime-test mod release tag"
    required: false
    default: "5.1.0"
  java_version:
    required: false
    default: "17"
  artifact_prefix:
    required: false
    default: "modpack-test"

outputs:
  result:
    description: "Test outcome — failure > success > first outcome > none"
    value: ${{ (steps.clienttest.outcome == 'failure' || steps.servertest.outcome == 'failure') && 'failure' || (steps.clienttest.outcome == 'success' || steps.servertest.outcome == 'success') && 'success' || steps.clienttest.outcome || steps.servertest.outcome || 'none' }}

runs:
  using: "composite"
  steps:
    - name: "Download client pack"
      if: ${{ inputs.pack_artifact != '' }}
      uses: actions/download-artifact@v8.0.2
      with:
        name: ${{ inputs.pack_artifact }}
        path: pack-client

    - name: "Download server pack"
      if: ${{ inputs.server_artifact != '' }}
      uses: actions/download-artifact@v8.0.2
      with:
        name: ${{ inputs.server_artifact }}
        path: pack-server

    - name: "Setup Java"
      uses: actions/setup-java@v6.1.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java_version }}

    - name: "Stage client"
      if: ${{ inputs.pack_artifact != '' }}
      shell: bash
      run: bash "${{ github.action_path }}/scripts/stage.sh" client

    - name: "Stage server"
      if: ${{ inputs.server_artifact != '' }}
      shell: bash
      run: bash "${{ github.action_path }}/scripts/stage.sh" server

    - name: "Pin client JVM"
      if: ${{ inputs.pack_artifact != '' }}
      shell: bash
      env:
        LOADER_TYPE: ${{ inputs.loader_type }}
        MC_VERSION: ${{ inputs.mc_version }}
        JAVA_VERSION: ${{ inputs.java_version }}
      run: bash "${{ github.action_path }}/scripts/pin-jvm.sh" client

    - name: "Client test"
      id: clienttest
      if: ${{ inputs.pack_artifact != '' }}
      uses: headlesshq/mc-runtime-test@5.0.0
      with:
        mc: ${{ inputs.mc_version }}
        modloader: ${{ inputs.loader_type }}
        java: ${{ inputs.java_version }}
        xvfb: 'true'
        dummy-assets: 'true'
        mc-runtime-test: ${{ inputs.test_mod }}
        mc-runtime-test-version: ${{ inputs.test_mod_version }}
        cache-mc: github
        download-hmc: 'true'
        hmc-version: '3.0.0-RC9'
        headlessmc-command: --jvm "-Djava.awt.headless=true -XX:ActiveProcessorCount=3 -DMcRuntimeGameTest=false"

    - name: "Pin server JVM"
      if: ${{ always() && inputs.server_artifact != '' }}
      shell: bash
      env:
        MC_VERSION: ${{ inputs.mc_version }}
        JAVA_VERSION: ${{ inputs.java_version }}
      run: bash "${{ github.action_path }}/scripts/pin-jvm.sh" server

    - name: "Server test"
      id: servertest
      if: ${{ always() && inputs.server_artifact != '' }}
      uses: headlesshq/mc-server-test@2.0.0
      with:
        mc: ${{ inputs.loader_version != '' && format('{0} {1}', inputs.mc_version, inputs.loader_version) || inputs.mc_version }}
        modloader: ${{ inputs.loader_type }}
        java: ${{ inputs.java_version }}
        cache-mc: 'false'
        download-hmc: 'true'
        hmc-version: '3.0.0-RC9'
        headlessmc-command: --jvm "-Djava.awt.headless=true"
        test-file: 'none'

    - name: "Collect results"
      if: always()
      shell: bash
      env:
        CLIENT_OUTCOME: ${{ steps.clienttest.outcome }}
        SERVER_OUTCOME: ${{ steps.servertest.outcome }}
      run: bash "${{ github.action_path }}/scripts/collect-results.sh"

    - name: "Analyze logs"
      if: always()
      shell: bash
      run: bash "${{ github.action_path }}/scripts/analyze-logs.sh"

    - name: "Upload client logs"
      if: ${{ always() && inputs.pack_artifact != '' }}
      id: up-client
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ${{ inputs.artifact_prefix }}-logs-client
        path: |
          client/logs/
          client/crash-reports/
          client/hs_err_pid*.log
          analysis.md
        if-no-files-found: warn

    - name: "Upload server logs"
      if: ${{ always() && inputs.server_artifact != '' }}
      id: up-server
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ${{ inputs.artifact_prefix }}-logs-server
        path: |
          server/logs/
          server/crash-reports/
          server/hs_err_pid*.log
          analysis.md
        if-no-files-found: warn

    - name: "Test summary"
      if: always()
      shell: bash
      env:
        CLIENT_LOGS_URL: ${{ steps.up-client.outputs.artifact-url }}
        SERVER_LOGS_URL: ${{ steps.up-server.outputs.artifact-url }}
      run: bash "${{ github.action_path }}/scripts/write-summary.sh"

    - name: "Upload logs to mclo.gs"
      if: always()
      shell: bash
      env:
        HAS_SERVER: ${{ inputs.server_artifact != '' }}
      run: bash "${{ github.action_path }}/scripts/upload-mclogs.sh"

    - name: "Build failure report"
      if: always()
      shell: bash
      env:
        CLIENT_LOGS_URL: ${{ steps.up-client.outputs.artifact-url }}
        SERVER_LOGS_URL: ${{ steps.up-server.outputs.artifact-url }}
        HAS_SERVER: ${{ inputs.server_artifact != '' }}
      run: bash "${{ github.action_path }}/scripts/build-report.sh"

    - name: "Resolve PR number"
      if: ${{ env.COMMENT == '1' }}
      env:
        GH_TOKEN: ${{ github.token }}
        PR_INPUT: ${{ inputs.pr_number || github.event.pull_request.number || '' }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      shell: bash
      run: bash "${{ github.action_path }}/scripts/resolve-pr.sh"

    - name: "Comment PR on failure"
      if: ${{ env.COMMENT == '1' && env.PR_NUMBER != '' }}
      uses: mshick/add-pr-comment@v3.12.0
      with:
        issue: ${{ env.PR_NUMBER }}
        message-path: pr-comment.md
        message-id: runtime-test
