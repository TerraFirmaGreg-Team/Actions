name: "Automerge PR"
description: "Merge a PR now or enable GitHub auto-merge"

inputs:
  github_token:
    required: true
  pull_request:
    required: true
  merge_method:
    description: "merge|squash|rebase — must be allowed by the target branch ruleset"
    required: false
    default: "squash"
  auto_merge:
    description: "'true' = enable GitHub auto-merge and let rulesets gate the merge; 'false' = merge immediately"
    required: false
    default: "false"
  delete_branch:
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: "Merge"
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR: ${{ inputs.pull_request }}
        METHOD: ${{ inputs.merge_method }}
        DEL: ${{ inputs.delete_branch == 'true' && '--delete-branch' || '' }}
      run: |
        if [ "${{ inputs.auto_merge }}" = "true" ]; then
          [ "$(gh pr view "$PR" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "false" ] \
            && gh pr merge --auto "--$METHOD" "$PR"
        else
          # GitHub may still compute mergeable_state right after PR creation
          for i in 1 2 3 4; do
            gh pr merge "--$METHOD" $DEL "$PR" && break
            [ "$i" = 4 ] && exit 1
            sleep 5
          done
        fi
