name: "Automerge PR"
description: "Merge a PR now or enable GitHub auto-merge"

inputs:
  github_token:
    description: "used when app credentials are not provided"
    required: false
    default: ""
  app_client_id:
    description: "GitHub App client-id — generates a token via create-github-app-token"
    required: false
    default: ""
  app_private_key:
    required: false
    default: ""
  pull_request:
    description: "PR number; empty skips the merge"
    required: false
    default: ""
  repository:
    description: "owner/name of the PR's repo (defaults to the calling repo)"
    required: false
    default: ""
  merge_method:
    description: "merge|squash|rebase — must be allowed by the target branch ruleset"
    required: false
    default: "squash"
  auto_merge:
    description: "'true' = enable GitHub auto-merge (waits for checks/reviews itself); 'false' = merge immediately"
    required: false
    default: "false"
  delete_branch:
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: "Generate GitHub App token"
      id: app
      if: inputs.app_private_key != '' && inputs.pull_request != ''
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.app_client_id }}
        private-key: ${{ inputs.app_private_key }}

    - name: "Merge"
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app.outputs.token || inputs.github_token }}
        GH_REPO: ${{ inputs.repository || github.repository }}
        PR: ${{ inputs.pull_request }}
        METHOD: ${{ inputs.merge_method }}
        DEL: ${{ inputs.delete_branch == 'true' && '--delete-branch' || '' }}
      run: |
        if [ -z "$PR" ]; then
          echo "No pull request provided, skipping merge"
          exit 0
        fi

        merge() { gh pr merge "--$METHOD" $DEL "$PR"; }

        if [ "${{ inputs.auto_merge }}" = "true" ]; then
          enabled="$(gh pr view "$PR" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [ "$enabled" = "true" ]; then
            echo "Auto-merge is already enabled"
          else
            gh pr merge --auto "--$METHOD" $DEL "$PR"
          fi
        else
          # GitHub may still compute mergeable_state right after PR creation
          for i in 1 2 3 4; do
            merge && break
            [ "$i" = 4 ] && exit 1
            sleep 5
          done
        fi
