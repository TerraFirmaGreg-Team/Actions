name: "Automerge PR"
description: "Merge a PR now or enable GitHub auto-merge"

inputs:
  github_token:
    description: "used when app credentials are not provided"
    required: false
    default: ""
  app_client_id:
    description: "GitHub App client-id — generates a token via create-github-app-token"
    required: false
    default: ""
  app_private_key:
    required: false
    default: ""
  pull_request:
    required: true
  repository:
    description: "owner/name of the PR's repo (defaults to the calling repo)"
    required: false
    default: ""
  merge_method:
    description: "merge|squash|rebase — must be allowed by the target branch ruleset"
    required: false
    default: "squash"
  auto_merge:
    description: "'true' = poll until the PR becomes mergeable (checks/reviews pass), then merge; 'false' = merge immediately"
    required: false
    default: "false"
  wait_minutes:
    description: "auto_merge mode: max minutes to wait for the PR to become mergeable"
    required: false
    default: "120"
  delete_branch:
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: "Generate GitHub App token"
      id: app
      if: inputs.app_private_key != ''
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.app_client_id }}
        private-key: ${{ inputs.app_private_key }}

    - name: "Merge"
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app.outputs.token || inputs.github_token }}
        GH_REPO: ${{ inputs.repository || github.repository }}
        PR: ${{ inputs.pull_request }}
        METHOD: ${{ inputs.merge_method }}
        DEL: ${{ inputs.delete_branch == 'true' && '--delete-branch' || '' }}
      run: |
        merge() { gh pr merge "--$METHOD" $DEL "$PR"; }

        if [ "${{ inputs.auto_merge }}" = "true" ]; then
          deadline=$(( SECONDS + ${{ inputs.wait_minutes }} * 60 ))
          last=""
          while :; do
            read -r pr_state mstate < <(gh pr view "$PR" --json state,mergeStateStatus --jq '"\(.state) \(.mergeStateStatus)"')
            case "$pr_state" in
              MERGED) echo "Already merged"; exit 0 ;;
              CLOSED) echo "PR is closed"; exit 1 ;;
            esac
            case "$mstate" in
              clean|CLEAN|unstable|UNSTABLE) merge && exit 0 ;;
              dirty|DIRTY) echo "PR has merge conflicts"; exit 1 ;;
            esac
            [ "$SECONDS" -ge "$deadline" ] && { echo "Timeout waiting for mergeable state (last: $mstate)"; exit 1; }
            [ "$mstate" != "$last" ] && echo "mergeStateStatus: $mstate"; last=$mstate
            sleep 30
          done
        else
          # GitHub may still compute mergeable_state right after PR creation
          for i in 1 2 3 4; do
            merge && break
            [ "$i" = 4 ] && exit 1
            sleep 5
          done
        fi
