name: "Create Pull Request"
description: "Create PR unless one exists"

inputs:
  repository:
    description: "Target repo owner/name — defaults to the calling repo"
    required: false
    default: ""
  repository_path:
    description: "Path where `repository` is already checked out ('' = the action checks it out at the workspace root)"
    required: false
    default: ""
  checkout_token:
    description: "Token for the internal checkout (defaults to github_token, then GITHUB_TOKEN)"
    required: false
    default: ""
  source_branch:
    required: false
    default: "dev"
  target_branch:
    required: false
    default: "main"
  title:
    required: false
    default: ""
  body:
    description: "Overrides generated body"
    required: false
    default: ""
  label:
    required: false
    default: ""
  draft:
    required: false
    default: "true"
  milestone:
    description: "Milestone title if it exists"
    required: false
    default: ""
  project_name:
    required: false
    default: ""
  release_type:
    required: false
    default: ""
  loader_type:
    required: false
    default: ""
  loader_version:
    required: false
    default: ""
  changelog:
    required: false
    default: ""
  ignore_users:
    required: false
    default: "dependabot"
  github_token:
    required: false
    default: ""

outputs:
  pr_number:
    value: ${{ steps.create_pr.outputs.pr_number || steps.check_pr.outputs.number }}
  pr_url:
    value: ${{ steps.create_pr.outputs.pr_url || steps.check_pr.outputs.url }}

runs:
  using: "composite"
  steps:
    - name: "Checkout"
      if: ${{ inputs.repository_path == '' }}
      uses: actions/checkout@v7.0.1
      with:
        repository: ${{ inputs.repository }}
        token: ${{ inputs.checkout_token || inputs.github_token || github.token }}
        fetch-depth: 0

    - name: "Check existing PRs"
      id: check_pr
      uses: actions/github-script@v9.0.0
      with:
        github-token: ${{ inputs.github_token || github.token }}
        result-encoding: string
        script: |
          const slug = '${{ inputs.repository }}';
          const [owner, name] = slug ? slug.split('/') : [context.repo.owner, context.repo.repo];
          try {
            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo: name,
              state: 'open',
              head: `${owner}:${{ inputs.source_branch }}`,
              base: '${{ inputs.target_branch }}'
            });
            core.setOutput('exists', prs.length > 0);
            if (prs.length > 0) {
              core.setOutput('number', prs[0].number);
              core.setOutput('url', prs[0].html_url);
            }
            console.log(`PR exists: ${prs.length > 0}`);
          } catch (error) {
            core.setFailed(`PR check failed: ${error}`);
            core.setOutput('exists', true);
          }

    - name: "Check milestone"
      id: check_milestone
      if: ${{ inputs.milestone != '' }}
      uses: actions/github-script@v9.0.0
      with:
        github-token: ${{ inputs.github_token || github.token }}
        result-encoding: string
        script: |
          const slug = '${{ inputs.repository }}';
          const [owner, name] = slug ? slug.split('/') : [context.repo.owner, context.repo.repo];
          const version = '${{ inputs.milestone }}';
          try {
            const milestones = await github.rest.issues.listMilestones({
              owner,
              repo: name,
              state: 'all'
            });
            const exists = milestones.data.some(m => m.title === version);
            console.log(`Milestone "${version}" exists: ${exists}`);
            return exists;
          } catch (error) {
            console.log('Milestone check failed, skipping milestone');
            return false;
          }

    - name: "Default body"
      id: default_body
      if: ${{ inputs.body == '' }}
      shell: bash
      run: |
        {
          echo 'body<<EOF'
          echo "**This is an automated Pull Request from the ${{ inputs.source_branch }} branch.**"
          echo "📃 **Name**: ${{ inputs.project_name }}"
          echo "📃 **Release**:  \`${{ inputs.milestone }}\`"
          echo "📃 **Release Type**: \`${{ inputs.release_type }}\`"
          echo "📃 **Loader Type**: \`${{ inputs.loader_type }}\`"
          echo "📃 **Loader Version**: \`${{ inputs.loader_version }}\`"
          echo "${{ inputs.changelog }}"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - name: "Create Pull Request"
      id: create_pr
      if: ${{ steps.check_pr.outputs.exists == 'false' }}
      uses: devops-infra/action-pull-request@v1.4.0
      with:
        github_token: ${{ inputs.github_token || github.token }}
        repository: ${{ inputs.repository }}
        repository_path: ${{ inputs.repository_path || '.' }}
        source_branch: ${{ inputs.source_branch }}
        target_branch: ${{ inputs.target_branch }}
        milestone: ${{ inputs.milestone != '' && steps.check_milestone.outputs.result == 'true' && inputs.milestone || '' }}
        ignore_users: ${{ inputs.ignore_users }}
        draft: ${{ inputs.draft }}
        label: ${{ inputs.label }}
        title: "${{ inputs.title || format('new Release: {0}', inputs.milestone) }}"
        body: ${{ inputs.body || steps.default_body.outputs.body }}
