name: "🚀 Release Modpack"
description: "Публикация релиза на GitHub, CurseForge и Modrinth"

inputs:
  enabled:
    description: "Выполнять ли релиз"
    required: false
    default: true
  project_full_name:
    description: "Имя проекта с версией"
    required: true
  project_version:
    description: "Версия проекта"
    required: true
  release_type:
    description: "Тип релиза (release/beta/alpha)"
    required: false
    default: release
  changelog:
    description: "Changelog"
    required: false
    default: ""
  diff:
    description: "Diff в markdown"
    required: false
    default: ""
  mc_version:
    description: "Версия Minecraft"
    required: false
    default: unknown
  enable_release_github:
    description: "Публиковать GitHub релиз"
    required: false
    default: true
  enable_release_curseforge:
    description: "Публиковать CurseForge релиз"
    required: false
    default: true
  enable_release_modrinth:
    description: "Публиковать Modrinth релиз"
    required: false
    default: false
  curseforge_slug:
    description: "Slug проекта CurseForge (необязательно)"
    required: false
    default: ""
  modrinth_project_id:
    description: "ID проекта Modrinth"
    required: false
    default: ""
  close_issues_label:
    description: "Закрывать задачи с указанным лейблом"
    required: false
    default: ""
  close_issues_comment:
    description: "Комментарий при закрытии задачи"
    required: false
    default: ""

outputs:
  github_release_url:
    description: "Ссылка на GitHub релиз"
    value: ${{ steps.github_release.outputs.url }}
  curseforge_file_id:
    description: "ID файла CurseForge"
    value: ${{ steps.curseforge_upload.outputs.id }}
  modrinth_release_id:
    description: "ID релиза Modrinth"
    value: ${{ steps.modrinth_upload.outputs.id }}

runs:
  using: "composite"
  steps:
    - name: "🛑 Skip check"
      id: guard
      shell: bash
      run: |
        if [ "${{ inputs.enabled }}" != "true" ]; then
          echo "skip=true" >> $GITHUB_OUTPUT
        fi

    - name: "📦 Download artifacts"
      if: ${{ steps.guard.outputs.skip != 'true' }}
      uses: actions/download-artifact@v5.0.0
      with:
        merge-multiple: true

    - name: "🧾 Collect release files"
      id: collect
      if: ${{ steps.guard.outputs.skip != 'true' }}
      shell: bash
      env:
        NAME: ${{ inputs.project_full_name }}
      run: |
        set -eo pipefail
        files=()
        for candidate in "${NAME}-curseforge.zip" "${NAME}-modrinth.mrpack" "${NAME}-serverpack.zip" "${NAME}-multimc.zip"; do
          if [[ -f "$candidate" ]]; then
            files+=("$candidate")
          fi
        done

        if [[ ${#files[@]} -eq 0 ]]; then
          echo "::warning::No artifacts found for release"
        fi

        {
          echo 'list<<EOF'
          printf '%s\n' "${files[@]}"
          echo EOF
        } >> "$GITHUB_OUTPUT"

    - name: "🔒 Close issues"
      if: ${{ steps.guard.outputs.skip != 'true' && inputs.close_issues_label != '' }}
      uses: Xikaro/close-issues-based-on-label@master
      env:
        LABEL: ${{ inputs.close_issues_label }}
        COMMENT: ${{ inputs.close_issues_comment }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: "📄 Format diff"
      id: diff_format
      if: ${{ steps.guard.outputs.skip != 'true' && inputs.diff != '' }}
      uses: roamingowl/template-output-with-eta@v2.0.0
      with:
        template: |
          ```markdown
          ${{ inputs.diff }}
          ```

    - name: "🚀 GitHub Release"
      id: github_release
      if: ${{ steps.guard.outputs.skip != 'true' && inputs.enable_release_github == 'true' }}
      uses: softprops/action-gh-release@v2.3.4
      with:
        name: ${{ inputs.project_version }}
        tag_name: ${{ inputs.project_version }}
        body: |
          ${{ inputs.changelog }}
          ${{ steps.diff_format.outputs.text }}
        prerelease: ${{ inputs.release_type != 'release' }}
        generate_release_notes: true
        files: ${{ steps.collect.outputs.list }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: "🔒 Validate CurseForge secrets"
      if: ${{ steps.guard.outputs.skip != 'true' && inputs.enable_release_curseforge == 'true' }}
      shell: bash
      run: |
        [[ -n "${{ secrets.CURSEFORGE_TOKEN }}" ]] || { echo '::error::Secret CURSEFORGE_TOKEN is missing'; exit 1; }
        [[ -n "${{ vars.CURSEFORGE_ID }}" ]] || { echo '::error::Variable CURSEFORGE_ID is missing'; exit 1; }

    - name: "✅ Ensure CurseForge files"
      if: ${{ steps.guard.outputs.skip != 'true' && inputs.enable_release_curseforge == 'true' }}
      shell: bash
      env:
        NAME: ${{ inputs.project_full_name }}
      run: |
        [[ -f "${NAME}-curseforge.zip" ]] || { echo '::error::missing curseforge artifact'; exit 1; }
        [[ -f "${NAME}-serverpack.zip" ]] || { echo '::error::missing serverpack artifact'; exit 1; }

    - name: "🚀 Upload to CurseForge"
      id: curseforge_upload
      if: ${{ steps.guard.outputs.skip != 'true' && inputs.enable_release_curseforge == 'true' }}
      uses: Xikaro/upload-curseforge-modpack-action@1.1.1
      with:
        api-token: ${{ secrets.CURSEFORGE_TOKEN }}
        project-id: ${{ vars.CURSEFORGE_ID }}
        display-name: ${{ inputs.project_full_name }}
        modpack-path: ${{ inputs.project_full_name }}-curseforge.zip
        server-display-name: ${{ inputs.project_full_name }}-serverpack
        modpack-server-path: ${{ inputs.project_full_name }}-serverpack.zip
        changelog: |
          ${{ inputs.changelog }}
          ${{ inputs.diff }}
        changelog-format: markdown
        game-version: ${{ inputs.mc_version }}
        release-type: ${{ inputs.release_type }}

    - name: "🔒 Validate Modrinth secrets"
      if: ${{ steps.guard.outputs.skip != 'true' && inputs.enable_release_modrinth == 'true' }}
      shell: bash
      run: |
        [[ -n "${{ secrets.MODRINTH_TOKEN }}" ]] || { echo '::error::Secret MODRINTH_TOKEN is missing'; exit 1; }
        [[ -n "${{ inputs.modrinth_project_id }}" ]] || { echo '::error::Input modrinth_project_id is missing'; exit 1; }

    - name: "✅ Ensure Modrinth artifact"
      if: ${{ steps.guard.outputs.skip != 'true' && inputs.enable_release_modrinth == 'true' }}
      shell: bash
      env:
        NAME: ${{ inputs.project_full_name }}
      run: |
        [[ -f "${NAME}-modrinth.mrpack" ]] || { echo '::error::missing modrinth artifact'; exit 1; }

    - name: "🚀 Upload to Modrinth"
      id: modrinth_upload
      if: ${{ steps.guard.outputs.skip != 'true' && inputs.enable_release_modrinth == 'true' }}
      uses: tbolt/post-to-modrinth@v1.0.3
      with:
        token: ${{ secrets.MODRINTH_TOKEN }}
        name: ${{ inputs.project_full_name }}
        version-number: ${{ inputs.project_version }}
        project-id: ${{ inputs.modrinth_project_id }}
        file-path: ${{ inputs.project_full_name }}-modrinth.mrpack
        changelog: ${{ inputs.changelog }}
        loaders: |
          fabric
        game-versions: ${{ inputs.mc_version }}
        release-type: ${{ inputs.release_type }}
